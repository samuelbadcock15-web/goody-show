<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>Goody Tonight Show - Contestant Studio</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; user-select: none; -webkit-user-select: none; touch-action: none; }
    body {
      background: #090314; color: #fff;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      min-height: 100vh; display: flex; flex-direction: column; align-items: center; padding: 8px;
      overflow: hidden;
    }
    #setup-card {
      width: 100%; max-width: 440px; background: #1b0933; border: 2px solid #ff79b0;
      border-radius: 16px; padding: 20px; text-align: center; margin-top: 20px;
    }
    .btn-select {
      width: 100%; padding: 16px; margin: 10px 0; border-radius: 12px; border: none;
      font-size: 1rem; font-weight: bold; text-transform: uppercase; cursor: pointer; color: #fff;
    }
    .btn-jake { background: #0984e3; }
    .btn-june { background: #d63031; }

    #live-stage-portal {
      width: 100%; max-width: 440px; height: 98vh; display: none; flex-direction: column; gap: 6px;
    }
    .badge-bar {
      display: flex; justify-content: space-between; align-items: center;
      background: #18092d; padding: 4px 10px; border-radius: 8px; font-family: monospace; font-size: 0.78rem;
    }

    .viewport-box {
      position: relative; width: 100%; height: 38vh; background: #000;
      border: 2px solid #ffda66; border-radius: 12px; overflow: hidden;
      box-shadow: 0 4px 16px rgba(255, 218, 102, 0.25);
    }
    #contestant3d { width: 100%; height: 100%; display: block; }
    #drag-hint {
      position: absolute; top: 6px; left: 8px; font-size: 0.7rem;
      background: rgba(0,0,0,0.65); padding: 2px 6px; border-radius: 4px;
      color: #ffda66; font-family: monospace; pointer-events: none;
    }
    #local-selfie-pip {
      position: absolute; bottom: 6px; right: 6px; width: 26%; aspect-ratio: 4 / 3;
      border: 2px solid #39ff14; border-radius: 6px; object-fit: cover;
      transform: scaleX(-1); background: #111; z-index: 10; pointer-events: none;
    }

    #btn-roll-dice {
      width: 100%; padding: 12px; background: #444; border: 2px solid #777;
      border-radius: 10px; font-size: 1rem; font-weight: 900; color: #888;
      text-transform: uppercase; letter-spacing: 1px; cursor: not-allowed;
    }
    #btn-roll-dice.active-roll {
      background: linear-gradient(180deg, #fdcb6e, #e17055);
      border-color: #ffeaa7; color: #2d3436; cursor: pointer;
      box-shadow: 0 0 12px #fdcb6e;
    }

    #status-pill {
      text-align: center; font-family: monospace; font-size: 0.84rem; color: #39ff14; min-height: 18px;
    }

    #trivia-card {
      background: #190930; border: 2px solid #00f0ff; border-radius: 10px; padding: 8px;
      display: none; flex-direction: column; gap: 6px;
    }
    #q-country-tag { font-size: 0.78rem; font-weight: bold; color: #ffda66; }
    #q-timer { font-family: monospace; font-weight: bold; color: #ff7675; text-align: right; }
    #q-text {
      font-size: 0.88rem; font-weight: 700; line-height: 1.3; color: #fff;
      background: rgba(0,0,0,0.4); padding: 6px; border-radius: 6px; border-left: 3px solid #00f0ff;
    }
    .options-grid { display: grid; grid-template-columns: 1fr; gap: 5px; }
    .btn-opt {
      padding: 8px 10px; background: #2f1454; border: 1px solid #9c4dd6; border-radius: 6px;
      color: #fff; font-size: 0.82rem; font-weight: bold; text-align: left; opacity: 0.6;
    }
    .btn-opt.unlocked { cursor: pointer; opacity: 1; border-color: #00f0ff; }
    .btn-opt.selected { background: #6c5ce7; border-color: #a29bfe; }
    .btn-opt.flash-green { background: #00b894 !important; }
    .btn-opt.flash-red { background: #d63031 !important; }

    .controls-panel {
      display: flex; justify-content: space-between; align-items: center;
      background: #140728; border: 1px solid #a29bfe; border-radius: 10px; padding: 6px 10px;
      margin-top: auto;
    }
    .dpad-label { font-size: 0.7rem; color: #ff9ff3; font-family: monospace; }
    .dpad-grid { display: grid; grid-template-columns: 44px 44px 44px; grid-template-rows: 36px 36px; gap: 4px; }
    .dpad-btn {
      background: #2b1154; border: 2px solid #ff79b0; border-radius: 6px; color: #fff;
      font-size: 1.1rem; font-weight: bold; display: flex; justify-content: center; align-items: center;
    }
    .dpad-btn:active { background: #ff79b0; color: #000; }
  </style>
</head>
<body>

  <div id="setup-card">
    <h2 style="color: #ffda66; margin-bottom: 8px;">The Goody Tonight Show</h2>
    <p style="color: #ebdcf9; font-size: 0.86rem; margin-bottom: 14px;">Select your contestant profile to start in the center of the studio:</p>
    <button class="btn-select btn-jake" id="btn-jake">I am Contestant 1 (Jake)</button>
    <button class="btn-select btn-june" id="btn-june">I am Contestant 2 (June)</button>
  </div>

  <main id="live-stage-portal">
    <div class="badge-bar">
      <span id="role-tag" style="color: #00f0ff;">CONNECTING...</span>
      <span style="color: #39ff14;">🔴 CONTESTANT POV</span>
    </div>

    <div class="viewport-box">
      <canvas id="contestant3d"></canvas>
      <div id="drag-hint">👆 Drag to look • D-Pad to walk</div>
      <video id="local-selfie-pip" autoplay playsinline muted></video>
    </div>

    <div id="status-pill">Waiting for host...</div>

    <button id="btn-roll-dice" disabled>🎲 ROLL DICE (LOCKED)</button>

    <div id="trivia-card">
      <div style="display: flex; justify-content: space-between;">
        <span id="q-country-tag">COUNTRY</span>
        <span id="q-timer">⏱️ 30s</span>
      </div>
      <div id="q-text">Loading question...</div>
      <div class="options-grid">
        <button class="btn-opt" id="opt-0" disabled>A) ...</button>
        <button class="btn-opt" id="opt-1" disabled>B) ...</button>
        <button class="btn-opt" id="opt-2" disabled>C) ...</button>
        <button class="btn-opt" id="opt-3" disabled>D) ...</button>
      </div>
    </div>

    <div class="controls-panel">
      <div class="dpad-label">
        🕹️ <strong>STAGE MOVE</strong><br>Walk around game floor
      </div>
      <div class="dpad-grid">
        <div></div>
        <button class="dpad-btn" id="dpad-fwd">▲</button>
        <div></div>
        <button class="dpad-btn" id="dpad-left">◀</button>
        <button class="dpad-btn" id="dpad-back">▼</button>
        <button class="dpad-btn" id="dpad-right">▶</button>
      </div>
    </div>
  </main>

  <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
  <script src="https://unpkg.com/peerjs@1.5.4/dist/peerjs.min.js"></script>

  <script>
    let localStream = null;
    let peer = null;
    let dataConn = null;
    let contestantId = "";
    let contestantName = "";
    let hasRolled = false;
    let rollTimer = null;
    let questionTimer = null;
    let currentQuestionData = null;
    let selectedOptionIndex = null;
    let contestantStudioPower = false;

    const setupCard = document.getElementById('setup-card');
    const liveStagePortal = document.getElementById('live-stage-portal');
    const localSelfiePip = document.getElementById('local-selfie-pip');
    const roleTag = document.getElementById('role-tag');
    const statusPill = document.getElementById('status-pill');
    const btnRollDice = document.getElementById('btn-roll-dice');

    const triviaCard = document.getElementById('trivia-card');
    const qCountryTag = document.getElementById('q-country-tag');
    const qText = document.getElementById('q-text');
    const qTimer = document.getElementById('q-timer');
    const optButtons = [
      document.getElementById('opt-0'),
      document.getElementById('opt-1'),
      document.getElementById('opt-2'),
      document.getElementById('opt-3')
    ];

    // THREE.JS CONTESTANT STAGE SCENE
    const viewportCanvas = document.getElementById('contestant3d');
    const scene = new THREE.Scene();
    scene.background = new THREE.Color(0x05020a);

    const camera = new THREE.PerspectiveCamera(65, 16 / 9, 0.1, 100);
    let camPos = new THREE.Vector3(0, 1.4, 0.8);
    let camYaw = 0;
    let camPitch = 0;
    camera.position.copy(camPos);

    const renderer = new THREE.WebGLRenderer({ canvas: viewportCanvas, antialias: true });
    renderer.setPixelRatio(window.devicePixelRatio);

    function resizeContestantViewport() {
      const rect = viewportCanvas.parentElement.getBoundingClientRect();
      renderer.setSize(rect.width, rect.height);
      camera.aspect = rect.width / rect.height;
      camera.updateProjectionMatrix();
    }
    window.addEventListener('resize', resizeContestantViewport);

    // Stage Lighting
    const ambientLight = new THREE.AmbientLight(0x181026, 0.2); scene.add(ambientLight);
    const stageSpot = new THREE.PointLight(0xffea00, 0, 15); stageSpot.position.set(0, 4, -1); scene.add(stageSpot);

    function updateContestantLighting(power) {
      ambientLight.intensity = power ? 0.9 : 0.2;
      stageSpot.intensity = power ? 2.5 : 0;
      updateGoodyFace(power);
    }

    // Build Stage Floor & Walls
    const carpet = new THREE.Mesh(new THREE.CylinderGeometry(7.0, 7.0, 0.1, 48), new THREE.MeshStandardMaterial({ color: 0x271147 }));
    scene.add(carpet);

    const stageWall = new THREE.Mesh(new THREE.CylinderGeometry(7.0, 7.0, 4.5, 32, 1, true, -Math.PI / 2, Math.PI), new THREE.MeshStandardMaterial({ color: 0x15092a, side: THREE.BackSide }));
    stageWall.position.y = 2.2;
    scene.add(stageWall);

    // Host Robot Goody (Fully Rigged with Face & Antenna)
    const hostGroup = new THREE.Group(); hostGroup.position.set(0, 0, -2.6);
    const podium = new THREE.Mesh(new THREE.CylinderGeometry(0.45, 0.55, 0.6, 20), new THREE.MeshStandardMaterial({ color: 0x2b154a }));
    podium.position.y = 0.3; hostGroup.add(podium);
    const hostBody = new THREE.Mesh(new THREE.BoxGeometry(0.5, 0.5, 0.4), new THREE.MeshStandardMaterial({ color: 0x333 }));
    hostBody.position.y = 0.9; hostGroup.add(hostBody);
    const hostHead = new THREE.Mesh(new THREE.BoxGeometry(0.46, 0.35, 0.35), new THREE.MeshStandardMaterial({ color: 0x333 }));
    hostHead.position.y = 1.35; hostGroup.add(hostHead);

    const antennaStem = new THREE.Mesh(new THREE.CylinderGeometry(0.015, 0.015, 0.22, 8), new THREE.MeshStandardMaterial({ color: 0x888888, metalness: 0.9 }));
    antennaStem.position.y = 1.62; hostGroup.add(antennaStem);
    const antennaOrb = new THREE.Mesh(new THREE.SphereGeometry(0.05, 8, 8), new THREE.MeshBasicMaterial({ color: 0x111111 }));
    antennaOrb.position.y = 1.74; hostGroup.add(antennaOrb);

    const faceCanvas = document.createElement('canvas'); faceCanvas.width = 128; faceCanvas.height = 128;
    const fctx = faceCanvas.getContext('2d'); fctx.fillStyle = '#000'; fctx.fillRect(0, 0, 128, 128);
    const faceTex = new THREE.CanvasTexture(faceCanvas);
    const hostFace = new THREE.Mesh(new THREE.PlaneGeometry(0.35, 0.25), new THREE.MeshBasicMaterial({ map: faceTex }));
    hostFace.position.set(0, 1.35, 0.19); hostGroup.add(hostFace);
    scene.add(hostGroup);

    function updateGoodyFace(power) {
      fctx.fillStyle = '#000'; fctx.fillRect(0, 0, 128, 128);
      if (power) {
        fctx.fillStyle = '#39ff14'; fctx.font = 'bold 48px monospace'; fctx.textAlign = 'center';
        fctx.fillText("^‿^", 64, 80);
        antennaOrb.material.color.setHex(0x39ff14);
      } else {
        antennaOrb.material.color.setHex(0x111111);
      }
      faceTex.needsUpdate = true;
    }
    updateGoodyFace(false);

    // Backstage Screens
    const screenMesh = new THREE.Mesh(new THREE.PlaneGeometry(6.4, 2.8), new THREE.MeshStandardMaterial({ color: 0x11111a }));
    screenMesh.position.set(0, 2.2, -4.5);
    scene.add(screenMesh);

    // 14 Game Show Floor Counters
    for (let i = 0; i < 32; i++) {
      const angle = i * 0.48;
      const radius = 0.7 + (i * 0.135);
      const x = Math.cos(angle) * radius;
      const z = 1.8 + (Math.sin(angle) * (radius * 0.88));
      const tile = new THREE.Mesh(new THREE.CylinderGeometry(0.28, 0.3, 0.06, 16), new THREE.MeshStandardMaterial({ color: (i % 2 === 0 ? 0xff7675 : 0x00f0ff) }));
      tile.position.set(x, 0.05, z);
      scene.add(tile);
    }

    // Touch-Drag Looking
    let isDragging = false;
    let lastX = 0, lastY = 0;

    viewportCanvas.addEventListener('touchstart', (e) => {
      isDragging = true;
      lastX = e.touches[0].clientX;
      lastY = e.touches[0].clientY;
    });

    viewportCanvas.addEventListener('touchmove', (e) => {
      if (!isDragging) return;
      const dx = e.touches[0].clientX - lastX;
      const dy = e.touches[0].clientY - lastY;
      lastX = e.touches[0].clientX;
      lastY = e.touches[0].clientY;

      camYaw -= dx * 0.006;
      camPitch = Math.max(-0.9, Math.min(0.9, camPitch - dy * 0.006));
      camera.rotation.set(camPitch, camYaw, 0, 'YXZ');
    });

    viewportCanvas.addEventListener('touchend', () => { isDragging = false; });

    // D-Pad Walking Movement
    const moveSpeed = 0.18;
    function movePlayer(dir) {
      const fwd = new THREE.Vector3(0, 0, -1).applyAxisAngle(new THREE.Vector3(0, 1, 0), camYaw);
      const side = new THREE.Vector3(1, 0, 0).applyAxisAngle(new THREE.Vector3(0, 1, 0), camYaw);

      if (dir === 'FORWARD') camPos.addScaledVector(fwd, moveSpeed);
      if (dir === 'BACK') camPos.addScaledVector(fwd, -moveSpeed);
      if (dir === 'LEFT') camPos.addScaledVector(side, -moveSpeed);
      if (dir === 'RIGHT') camPos.addScaledVector(side, moveSpeed);

      camPos.y = 1.4;
      if (Math.hypot(camPos.x, camPos.z) > 5.5) {
        camPos.clampLength(0, 5.5);
      }
      camera.position.copy(camPos);
    }

    const bindDpad = (id, dir) => {
      const el = document.getElementById(id);
      el.addEventListener('touchstart', (e) => { e.preventDefault(); movePlayer(dir); });
      el.addEventListener('mousedown', () => movePlayer(dir));
    };
    bindDpad('dpad-fwd', 'FORWARD');
    bindDpad('dpad-back', 'BACK');
    bindDpad('dpad-left', 'LEFT');
    bindDpad('dpad-right', 'RIGHT');

    // Join Flow
    document.getElementById('btn-jake').addEventListener('click', () => joinGame("goody-contestant-1", "Jake"));
    document.getElementById('btn-june').addEventListener('click', () => joinGame("goody-contestant-2", "June"));

    async function joinGame(id, name) {
      contestantId = id;
      contestantName = name;
      setupCard.style.display = 'none';
      liveStagePortal.style.display = 'flex';
      roleTag.textContent = `${name.toUpperCase()} (CONTESTANT)`;
      resizeContestantViewport();

      try {
        localStream = await navigator.mediaDevices.getUserMedia({
          video: { facingMode: "user", width: { ideal: 640 }, height: { ideal: 480 } },
          audio: { echoCancellation: true, noiseSuppression: true }
        });
        localSelfiePip.srcObject = localStream;

        peer = new Peer(contestantId);

        peer.on('open', () => {
          const call = peer.call("goody-main-studio", localStream, {
            metadata: { contestant: contestantId, name: contestantName }
          });

          dataConn = peer.connect("goody-main-studio", {
            metadata: { contestant: contestantId, name: contestantName }
          });

          dataConn.on('open', () => {
            statusPill.textContent = "Live on stage! Standby for host...";
          });

          dataConn.on('data', (data) => {
            if (data.type === "STUDIO_POWER") {
              if (data.power) {
                contestantStudioPower = true;
                updateContestantLighting(true);
              }
            } else if (data.type === "START_DICE_COUNTDOWN") {
              startTenSecondRoll();
            } else if (data.type === "ENABLE_TURN_ROLL") {
              if (data.activeContestant === contestantId) {
                startTurnRoll();
              } else {
                statusPill.textContent = "Waiting for other contestant to roll...";
              }
            } else if (data.type === "SHOW_QUESTION_LOCKED") {
              showQuestionLocked(data.question, data.forContestant === contestantId);
            } else if (data.type === "UNLOCK_QUESTION_INPUT") {
              if (data.forContestant === contestantId) {
                unlockQuestionInput();
              }
            } else if (data.type === "EVALUATION_RESULT") {
              handleEvaluationResult(data);
            }
          });
        });
      } catch (err) {
        alert("Camera & microphone permissions required: " + err.message);
      }
    }

    function startTenSecondRoll() {
      hasRolled = false;
      btnRollDice.disabled = false;
      btnRollDice.classList.add('active-roll');
      btnRollDice.textContent = "🎲 ROLL DICE NOW!";

      let timeLeft = 10;
      statusPill.textContent = `⏱️ ROLL TIMER: ${timeLeft}s`;

      if (rollTimer) clearInterval(rollTimer);
      rollTimer = setInterval(() => {
        timeLeft--;
        if (timeLeft > 0) {
          statusPill.textContent = `⏱️ ROLL TIMER: ${timeLeft}s`;
        } else {
          clearInterval(rollTimer);
          if (!hasRolled) executeRoll(true);
        }
      }, 1000);
    }

    function startTurnRoll() {
      hasRolled = false;
      btnRollDice.disabled = false;
      btnRollDice.classList.add('active-roll');
      btnRollDice.textContent = "🎲 YOUR TURN: ROLL DICE!";
      statusPill.textContent = "Tap roll to advance!";
    }

    function executeRoll(isAuto = false) {
      if (hasRolled) return;
      hasRolled = true;
      btnRollDice.disabled = true;
      btnRollDice.classList.remove('active-roll');
      btnRollDice.textContent = "DICE ROLLED!";

      const rollValue = Math.floor(Math.random() * 6) + 1;
      statusPill.textContent = isAuto ? `⏱️ Auto-rolled: ${rollValue}` : `🎲 You rolled: ${rollValue}!`;

      if (dataConn && dataConn.open) {
        dataConn.send({
          type: "PLAYER_ROLLED_DICE",
          contestant: contestantId,
          name: contestantName,
          roll: rollValue
        });
      }
    }
    btnRollDice.addEventListener('click', () => executeRoll(false));

    function showQuestionLocked(qData, isMyTurn) {
      currentQuestionData = qData;
      selectedOptionIndex = null;
      triviaCard.style.display = 'flex';
      qCountryTag.textContent = `🌍 ${qData.country} (${isMyTurn ? "YOUR QUESTION" : "OPPONENT'S QUESTION"})`;
      qText.textContent = qData.text || qData.q || "Listen carefully to the question from Goody:";
      qTimer.textContent = "🔒 LISTENING TO HOST...";

      qData.options.forEach((opt, idx) => {
        optButtons[idx].textContent = `${["A", "B", "C", "D"][idx]}) ${opt}`;
        optButtons[idx].className = "btn-opt";
        optButtons[idx].disabled = true;
      });
    }

    function unlockQuestionInput() {
      qTimer.textContent = "⏱️ 30s";
      optButtons.forEach(btn => {
        btn.disabled = false;
        btn.classList.add('unlocked');
      });

      let timeLeft = 30;
      if (questionTimer) clearInterval(questionTimer);
      questionTimer = setInterval(() => {
        timeLeft--;
        if (timeLeft > 0) {
          qTimer.textContent = `⏱️ ${timeLeft}s`;
        } else {
          clearInterval(questionTimer);
          qTimer.textContent = "TIME OUT!";
          optButtons.forEach(b => b.disabled = true);
          if (dataConn && dataConn.open) {
            dataConn.send({ type: "PLAYER_TIMEOUT", contestant: contestantId });
          }
        }
      }, 1000);
    }

    optButtons.forEach((btn, idx) => {
      btn.addEventListener('click', () => {
        if (selectedOptionIndex !== null) return;
        selectedOptionIndex = idx;
        if (questionTimer) clearInterval(questionTimer);

        optButtons.forEach(b => {
          b.disabled = true;
          b.classList.remove('unlocked');
        });
        btn.classList.add('selected');
        statusPill.textContent = "Answer locked in! Checking with Goody...";

        if (dataConn && dataConn.open) {
          dataConn.send({
            type: "PLAYER_ANSWERED",
            contestant: contestantId,
            chosenAnswer: currentQuestionData.options[idx]
          });
        }
      });
    });

    function handleEvaluationResult(data) {
      if (questionTimer) clearInterval(questionTimer);
      const isMe = data.forContestant === contestantId;

      if (isMe && selectedOptionIndex !== null) {
        if (data.isCorrect) {
          optButtons[selectedOptionIndex].classList.add('flash-green');
          statusPill.textContent = "🎉 CORRECT! Tile secured.";
        } else {
          optButtons[selectedOptionIndex].classList.add('flash-red');
          statusPill.textContent = "❌ INCORRECT! Returning to start.";
        }
      }

      setTimeout(() => {
        triviaCard.style.display = 'none';
        optButtons.forEach(b => b.className = "btn-opt");
      }, 7000);
    }

    function renderLoop() {
      requestAnimationFrame(renderLoop);
      renderer.render(scene, camera);
    }
    renderLoop();
  </script>
</body>
</html>
