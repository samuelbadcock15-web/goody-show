<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>Goody Tonight Show - Contestant 1</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; user-select: none; -webkit-user-select: none; }
    html, body {
      width: 100%; height: 100%; height: 100dvh; overflow: hidden;
      background: #090314; color: #fff;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
    }
    body { display: flex; flex-direction: column; align-items: center; padding: 6px; }

    #setup-card {
      width: 100%; max-width: 420px; background: #1b0933; border: 2px solid #0984e3;
      border-radius: 16px; padding: 20px; text-align: center; margin-top: 14px;
      box-shadow: 0 0 20px rgba(9, 132, 227, 0.35);
    }
    .badge-podium {
      display: inline-block; padding: 4px 10px; background: #0984e3; color: #fff;
      font-family: monospace; font-weight: 900; font-size: 0.8rem; border-radius: 6px; margin-bottom: 10px;
    }
    .input-label {
      font-size: 0.72rem; font-family: monospace; color: #ffda66; text-transform: uppercase;
      margin-bottom: 3px; display: block; text-align: left;
    }
    .form-group { margin-bottom: 10px; text-align: left; }
    #passcode-input {
      width: 100%; padding: 8px; font-size: 1.6rem; font-family: monospace; font-weight: 900;
      letter-spacing: 8px; text-align: center; background: #080313; color: #39ff14;
      border: 2px solid #a29bfe; border-radius: 10px; outline: none;
    }
    .text-field {
      width: 100%; padding: 10px 12px; font-size: 1rem; font-weight: bold; background: #080313;
      color: #00f0ff; border: 2px solid #a29bfe; border-radius: 10px; outline: none;
    }
    .btn-enter {
      width: 100%; padding: 14px; margin-top: 6px; border-radius: 12px; border: none;
      font-size: 1rem; font-weight: 900; text-transform: uppercase; cursor: pointer; color: #fff;
      background: linear-gradient(180deg, #0984e3, #0652dd); box-shadow: 0 3px 0 #003366;
    }

    #live-stage-portal {
      width: 100%; max-width: 440px; height: 100%; display: none; flex-direction: column;
      justify-content: space-between; gap: 4px;
    }
    .badge-bar {
      display: flex; justify-content: space-between; align-items: center;
      background: #18092d; padding: 4px 8px; border-radius: 6px; font-family: monospace; font-size: 0.72rem;
    }
    .screens-container {
      position: relative; width: 100%; aspect-ratio: 16 / 9; max-height: 25vh;
      background: #000; border: 2px solid #ffda66; border-radius: 10px; overflow: hidden;
    }
    #studio-stream-video { width: 100%; height: 100%; object-fit: cover; }
    #local-selfie-pip {
      position: absolute; bottom: 4px; right: 4px; width: 26%; aspect-ratio: 4 / 3;
      border: 2px solid #39ff14; border-radius: 6px; object-fit: cover; transform: scaleX(-1);
    }
    #turn-banner {
      width: 100%; padding: 5px 8px; border-radius: 6px; text-align: center;
      font-weight: 900; font-size: 0.75rem; font-family: monospace; text-transform: uppercase; display: none;
    }
    .turn-mine { background: #00b894; color: #fff; border: 1.5px solid #55efc4; }
    .turn-theirs { background: #2d1847; color: #dfe6e9; border: 1.5px solid #636e72; }
    .turn-tie { background: #e17055; color: #fff; border: 1.5px solid #fdcb6e; }

    #status-pill { text-align: center; font-family: monospace; font-size: 0.78rem; color: #39ff14; min-height: 18px; }

    #btn-roll-dice {
      width: 100%; padding: 10px; background: #444; border: 2px solid #777; border-radius: 10px;
      font-size: 0.95rem; font-weight: 900; color: #888; text-transform: uppercase; cursor: not-allowed;
    }
    #btn-roll-dice.active-roll {
      background: linear-gradient(180deg, #fdcb6e, #e17055); border-color: #ffeaa7; color: #2d3436; cursor: pointer;
    }

    #trivia-card {
      background: #190930; border: 2px solid #00f0ff; border-radius: 10px; padding: 8px;
      display: none; flex-direction: column; gap: 6px;
    }
    #q-country-tag { font-size: 0.75rem; font-weight: bold; color: #ffda66; text-transform: uppercase; }
    #q-timer { font-family: monospace; font-weight: bold; color: #ff7675; font-size: 0.8rem; text-align: right; }
    #q-text { font-size: 0.82rem; font-weight: 600; line-height: 1.3; color: #ffffff; background: rgba(0,0,0,0.35); padding: 6px; border-radius: 6px; }
    .options-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 6px; }
    .btn-opt {
      padding: 8px 6px; background: #2f1454; border: 1.5px solid #9c4dd6; border-radius: 8px;
      color: #fff; font-size: 0.75rem; font-weight: bold; text-align: left; cursor: not-allowed; opacity: 0.6;
    }
    .btn-opt.unlocked { cursor: pointer; opacity: 1; border-color: #00f0ff; }
    .btn-opt.selected { background: #6c5ce7; border-color: #a29bfe; }
    .btn-opt.flash-green { background: #00b894 !important; border-color: #55efc4 !important; }
    .btn-opt.flash-red { background: #d63031 !important; border-color: #ff7675 !important; }

    #recap-card {
      background: #1c0a32; border: 2px solid #fdcb6e; border-radius: 10px; padding: 8px 10px;
      display: none; flex-direction: column; gap: 4px;
    }
    .bottom-controls-bar { display: flex; justify-content: space-between; align-items: flex-end; width: 100%; gap: 6px; }
    .dpad-grid { display: grid; grid-template-columns: 46px 46px 46px; grid-template-rows: 32px 32px; gap: 4px; }
    .dpad-btn { background: #2b1154; border: 2px solid #ff79b0; border-radius: 6px; color: #fff; font-size: 1rem; cursor: pointer; display: flex; justify-content: center; align-items: center; }
    #look-pad {
      width: 105px; height: 86px; background: rgba(20, 7, 40, 0.95); border: 1.5px solid #00f0ff;
      border-radius: 10px; display: flex; flex-direction: column; justify-content: center; align-items: center;
    }
    #look-pad-knob { width: 28px; height: 28px; border-radius: 50%; background: #00f0ff; }
  </style>
</head>
<body>

  <div id="setup-card">
    <div class="badge-podium">PODIUM 1</div>
    <h2 style="color: #ffda66; margin-bottom: 12px; font-size: 1.25rem;">The Goody Tonight Show</h2>
    <div class="form-group">
      <span class="input-label">Host Screen 4-Digit Code:</span>
      <input type="text" id="passcode-input" maxlength="4" placeholder="0000" inputmode="numeric" />
    </div>
    <div class="form-group">
      <span class="input-label">First Name:</span>
      <input type="text" id="name-input" class="text-field" maxlength="15" placeholder="e.g. Alex" />
    </div>
    <div class="form-group">
      <span class="input-label">Country:</span>
      <input type="text" id="country-input" class="text-field" maxlength="24" placeholder="e.g. United Kingdom" />
    </div>
    <button class="btn-enter" id="btn-enter-studio">Enter Live Studio</button>
  </div>

  <main id="live-stage-portal">
    <div class="badge-bar">
      <span id="role-tag" style="color: #00f0ff;">CONNECTING...</span>
      <span id="match-timer-badge" style="color: #ffda66;"> 20:00</span>
      <span style="color: #39ff14;"> LIVE</span>
    </div>

    <div class="screens-container">
      <video id="studio-stream-video" autoplay playsinline></video>
      <video id="local-selfie-pip" autoplay playsinline muted></video>
    </div>

    <div id="turn-banner"></div>
    <div id="status-pill">Waiting for host...</div>

    <button id="btn-roll-dice" disabled> ROLL DICE (LOCKED)</button>

    <div id="trivia-card">
      <div style="display: flex; justify-content: space-between; align-items: center;">
        <span id="q-country-tag">COUNTRY</span>
        <span id="q-timer"> 30s</span>
      </div>
      <div id="q-text">Loading question...</div>
      <div class="options-grid">
        <button class="btn-opt" id="opt-0" disabled>A) ...</button>
        <button class="btn-opt" id="opt-1" disabled>B) ...</button>
        <button class="btn-opt" id="opt-2" disabled>C) ...</button>
        <button class="btn-opt" id="opt-3" disabled>D) ...</button>
      </div>
    </div>

    <div id="recap-card">
      <div id="recap-header" style="font-size:0.76rem; font-weight:bold; color:#fdcb6e;"> WHAT WE LEARNED:</div>
      <div id="recap-body" style="font-size:0.82rem; line-height:1.3;">...</div>
    </div>

    <div class="bottom-controls-bar">
      <div class="dpad-grid">
        <div></div><button class="dpad-btn" id="dpad-fwd">▲</button><div></div>
        <button class="dpad-btn" id="dpad-left">◀</button><button class="dpad-btn" id="dpad-back">▼</button><button class="dpad-btn" id="dpad-right">▶</button>
      </div>
      <div id="look-pad"><div id="look-pad-knob"></div></div>
    </div>
  </main>

  <script src="https://unpkg.com/peerjs@1.5.4/dist/peerjs.min.js"></script>
  <script>
    const CONTESTANT_ID = "goody-contestant-1";
    let localStream = null;
    let peer = null;
    let dataConn = null;
    let contestantName = "";
    let contestantCountry = "";
    let hasRolled = false;
    let rollTimer = null;
    let questionTimer = null;
    let currentQuestionData = null;
    let selectedOptionIndex = null;

    const passcodeInput = document.getElementById('passcode-input');
    const nameInput = document.getElementById('name-input');
    const countryInput = document.getElementById('country-input');
    const btnEnterStudio = document.getElementById('btn-enter-studio');
    const setupCard = document.getElementById('setup-card');
    const liveStagePortal = document.getElementById('live-stage-portal');
    const localSelfiePip = document.getElementById('local-selfie-pip');
    const studioStreamVideo = document.getElementById('studio-stream-video');
    const roleTag = document.getElementById('role-tag');
    const matchTimerBadge = document.getElementById('match-timer-badge');
    const turnBanner = document.getElementById('turn-banner');
    const statusPill = document.getElementById('status-pill');
    const btnRollDice = document.getElementById('btn-roll-dice');

    const triviaCard = document.getElementById('trivia-card');
    const qCountryTag = document.getElementById('q-country-tag');
    const qText = document.getElementById('q-text');
    const qTimer = document.getElementById('q-timer');
    const optButtons = [document.getElementById('opt-0'), document.getElementById('opt-1'), document.getElementById('opt-2'), document.getElementById('opt-3')];
    const recapCard = document.getElementById('recap-card');
    const recapBody = document.getElementById('recap-body');

    btnEnterStudio.addEventListener('click', async () => {
      const code = passcodeInput.value.trim();
      const name = nameInput.value.trim();
      const country = countryInput.value.trim() || "United Kingdom";
      if (!/^\d{4}$/.test(code) || name.length < 2) return alert("Please check 4-digit code and name.");

      contestantName = name; contestantCountry = country;
      setupCard.style.display = 'none'; liveStagePortal.style.display = 'flex';
      roleTag.textContent = `${name.toUpperCase()} (CONNECTING...)`;

      try {
        localStream = await navigator.mediaDevices.getUserMedia({ video: { width: 640, height: 480 }, audio: true });
        localSelfiePip.srcObject = localStream;
        peer = new Peer();

        peer.on('open', () => {
          const call = peer.call("goody-main-studio", localStream, { metadata: { contestant: CONTESTANT_ID, name, country, passcode: code } });
          call.on('stream', (stream) => { studioStreamVideo.srcObject = stream; studioStreamVideo.play().catch(() => {}); });

          dataConn = peer.connect("goody-main-studio", { metadata: { contestant: CONTESTANT_ID, name, country, passcode: code } });
          dataConn.on('data', (data) => {
            if (data.type === "AUTH_SUCCESS") {
              roleTag.textContent = `${contestantName.toUpperCase()} (P1)`;
              statusPill.textContent = "Connected! Standby for broadcast...";
            } else if (data.type === "START_DICE_COUNTDOWN" || data.type === "ENABLE_TURN_ROLL") {
              if (data.type === "ENABLE_TURN_ROLL" && data.activeContestantId !== CONTESTANT_ID) {
                turnBanner.style.display = 'block'; turnBanner.className = 'turn-theirs';
                turnBanner.textContent = `WAITING FOR ${data.activeContestantName.toUpperCase()}...`;
                btnRollDice.disabled = true; btnRollDice.classList.remove('active-roll');
                return;
              }
              turnBanner.style.display = 'block'; turnBanner.className = 'turn-mine';
              turnBanner.textContent = "YOUR TURN TO ROLL!";
              startTenSecondRoll();
            } else if (data.type === "SHOW_QUESTION_LOCKED") {
              const isMe = data.activeContestantId === CONTESTANT_ID;
              turnBanner.style.display = 'block'; turnBanner.className = isMe ? 'turn-mine' : 'turn-theirs';
              turnBanner.textContent = isMe ? "YOUR QUESTION!" : `${data.activeContestantName.toUpperCase()}'S QUESTION`;
              showQuestionLocked(data.question, isMe);
            } else if (data.type === "UNLOCK_QUESTION_INPUT" && data.activeContestantId === CONTESTANT_ID) {
              unlockQuestionInput();
            } else if (data.type === "START_TIE_BREAKER") {
              turnBanner.style.display = 'block'; turnBanner.className = 'turn-tie';
              turnBanner.textContent = "SUDDEN DEATH! FIRST TO BUZZ WINS!";
              startTieBreakerQuestion(data.question);
            } else if (data.type === "EVALUATION_RESULT" || data.type === "TIE_BREAKER_RESULT") {
              handleResult(data);
            } else if (data.type === "SYNC_MATCH_TIMER") {
              matchTimerBadge.textContent = ` ${data.timeStr}`;
            } else if (data.type === "GAME_OVER") {
              btnRollDice.disabled = true; btnRollDice.classList.remove('active-roll');
              turnBanner.textContent = data.winner === "NOBODY" ? "ROLLOVER! NOBODY WINS!" : `${data.winner.toUpperCase()} WINS!`;
            }
          });
        });
      } catch (err) { alert("Camera/Mic required: " + err.message); location.reload(); }
    });

    function startTenSecondRoll() {
      hasRolled = false;
      btnRollDice.disabled = false; btnRollDice.classList.add('active-roll');
      btnRollDice.textContent = "ROLL DICE NOW!";
      let left = 10;
      if (rollTimer) clearInterval(rollTimer);
      rollTimer = setInterval(() => {
        left--;
        statusPill.textContent = `ROLL: ${left}s`;
        if (left <= 0) { clearInterval(rollTimer); if (!hasRolled) executeRoll(true); }
      }, 1000);
    }

    function executeRoll(isAuto) {
      if (hasRolled) return;
      hasRolled = true;
      if (rollTimer) clearInterval(rollTimer);
      btnRollDice.disabled = true; btnRollDice.classList.remove('active-roll');
      const val = Math.floor(Math.random() * 6) + 1;
      statusPill.textContent = isAuto ? `Auto-rolled: ${val}` : `You rolled: ${val}!`;
      if (dataConn?.open) dataConn.send({ type: "PLAYER_ROLLED_DICE", contestant: CONTESTANT_ID, name: contestantName, roll: val });
    }
    btnRollDice.addEventListener('click', () => executeRoll(false));

    function showQuestionLocked(qData, isMe) {
      currentQuestionData = qData; selectedOptionIndex = null;
      btnRollDice.style.display = 'none'; recapCard.style.display = 'none'; triviaCard.style.display = 'flex';
      qCountryTag.textContent = `${qData.country} (${isMe ? "YOU" : "OPPONENT"})`;
      qText.textContent = qData.q || qData.text;
      qTimer.textContent = "LISTENING...";
      qData.options.forEach((opt, idx) => {
        optButtons[idx].textContent = `${["A","B","C","D"][idx]}) ${opt}`;
        optButtons[idx].className = "btn-opt"; optButtons[idx].disabled = true;
      });
    }

    function unlockQuestionInput() {
      qTimer.textContent = "30s";
      optButtons.forEach(b => { b.disabled = false; b.classList.add('unlocked'); });
      let left = 30;
      if (questionTimer) clearInterval(questionTimer);
      questionTimer = setInterval(() => {
        left--; qTimer.textContent = `${left}s`;
        if (left <= 0) {
          clearInterval(questionTimer);
          optButtons.forEach(b => b.disabled = true);
          if (dataConn?.open) dataConn.send({ type: "PLAYER_TIMEOUT", contestant: CONTESTANT_ID });
        }
      }, 1000);
    }

    function startTieBreakerQuestion(qData) {
      currentQuestionData = qData; selectedOptionIndex = null;
      triviaCard.style.display = 'flex'; qCountryTag.textContent = "SUDDEN DEATH TIE-BREAKER";
      qText.textContent = qData.q || qData.text; qTimer.textContent = "BUZZ IN NOW!";
      qData.options.forEach((opt, idx) => {
        optButtons[idx].textContent = `${["A","B","C","D"][idx]}) ${opt}`;
        optButtons[idx].className = "btn-opt unlocked"; optButtons[idx].disabled = false;
      });
    }

    optButtons.forEach((btn, idx) => {
      btn.addEventListener('click', () => {
        if (selectedOptionIndex !== null) return;
        selectedOptionIndex = idx;
        if (questionTimer) clearInterval(questionTimer);
        optButtons.forEach(b => { b.disabled = true; b.classList.remove('unlocked'); });
        btn.classList.add('selected');
        statusPill.textContent = "Locked in! Checking...";
        if (dataConn?.open) dataConn.send({ type: "PLAYER_ANSWERED", contestant: CONTESTANT_ID, chosenAnswer: currentQuestionData.options[idx] });
      });
    });

    function handleResult(data) {
      if (questionTimer) clearInterval(questionTimer);
      const isMe = (data.forContestant || data.winner) === CONTESTANT_ID;
      const targetIdx = currentQuestionData ? currentQuestionData.options.indexOf(data.chosenAnswer) : -1;
      if (targetIdx !== -1 && optButtons[targetIdx]) {
        optButtons[targetIdx].classList.add(data.isCorrect ? 'flash-green' : 'flash-red');
      }
      setTimeout(() => {
        triviaCard.style.display = 'none';
        recapBody.textContent = data.recap || "Round resolved!";
        recapCard.style.display = 'flex';
      }, 1200);
    }

    const sendMove = (dir) => dataConn?.open && dataConn.send({ type: "PLUSHIE_MOVE", contestant: CONTESTANT_ID, direction: dir });
    ['fwd', 'back', 'left', 'right'].forEach(d => {
      document.getElementById(`dpad-${d}`).addEventListener('click', () => sendMove(d.toUpperCase()));
    });
  </script>
</body>
</html>
