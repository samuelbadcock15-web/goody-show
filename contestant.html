<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>Goody Tonight Show - Contestant Companion</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; user-select: none; -webkit-user-select: none; }
    body {
      background: #090314; color: #fff;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      min-height: 100vh; display: flex; flex-direction: column; align-items: center; padding: 10px;
      overflow-x: hidden;
    }

    #setup-card {
      width: 100%; max-width: 440px; background: #1b0933; border: 2px solid #ff79b0;
      border-radius: 16px; padding: 20px; text-align: center; margin-top: 15px;
    }
    .btn-select {
      width: 100%; padding: 16px; margin: 10px 0; border-radius: 12px; border: none;
      font-size: 1rem; font-weight: bold; text-transform: uppercase; cursor: pointer; color: #fff;
    }
    .btn-jake { background: #0984e3; }
    .btn-june { background: #d63031; }

    #live-stage-portal {
      width: 100%; max-width: 440px; display: none; flex-direction: column; gap: 8px;
    }

    .screens-container {
      position: relative; width: 100%; aspect-ratio: 16 / 9; background: #000;
      border: 2px solid #ffda66; border-radius: 12px; overflow: hidden;
      box-shadow: 0 4px 20px rgba(255, 218, 102, 0.25);
    }
    #studio-stream-video {
      width: 100%; height: 100%; object-fit: cover;
    }
    #local-selfie-pip {
      position: absolute; bottom: 8px; right: 8px; width: 28%; aspect-ratio: 4 / 3;
      border: 2px solid #39ff14; border-radius: 8px; object-fit: cover;
      transform: scaleX(-1); background: #111; z-index: 5;
    }

    .badge-bar {
      display: flex; justify-content: space-between; align-items: center;
      background: #18092d; padding: 6px 12px; border-radius: 8px; font-family: monospace; font-size: 0.8rem;
    }

    .action-panel {
      display: flex; flex-direction: column; gap: 8px; width: 100%;
    }

    #btn-roll-dice {
      width: 100%; padding: 16px; background: #444;
      border: 3px solid #777; border-radius: 14px; font-size: 1.2rem; font-weight: 900;
      color: #888; text-transform: uppercase; letter-spacing: 1px; cursor: not-allowed;
      transition: all 0.2s ease;
    }
    #btn-roll-dice.active-roll {
      background: linear-gradient(180deg, #fdcb6e, #e17055);
      border-color: #ffeaa7; color: #2d3436; cursor: pointer;
      box-shadow: 0 4px 0 #b3392b, 0 0 15px #fdcb6e;
    }
    #btn-roll-dice.active-roll:active {
      transform: translateY(3px); box-shadow: 0 1px 0 #b3392b;
    }

    #timer-display {
      text-align: center; font-family: monospace; font-size: 1.15rem; font-weight: bold;
      color: #ff7675; min-height: 24px;
    }
    #dice-result-pill {
      text-align: center; font-family: monospace; font-size: 0.95rem; color: #39ff14; min-height: 22px;
    }

    .dpad-section {
      background: #140728; border: 2px solid #a29bfe; border-radius: 14px; padding: 10px;
      display: flex; flex-direction: column; align-items: center; gap: 6px;
    }
    .dpad-label {
      font-size: 0.76rem; font-family: monospace; color: #ff9ff3; text-transform: uppercase; letter-spacing: 0.5px;
    }
    .dpad-grid {
      display: grid; grid-template-columns: 55px 55px 55px; grid-template-rows: 45px 45px; gap: 6px;
    }
    .dpad-btn {
      background: #2b1154; border: 2px solid #ff79b0; border-radius: 8px; color: #fff;
      font-size: 1.2rem; font-weight: bold; display: flex; justify-content: center; align-items: center;
    }
    .dpad-btn:active { background: #ff79b0; color: #000; }
  </style>
</head>
<body>

  <div id="setup-card">
    <h2 style="color: #ffda66; margin-bottom: 8px;">The Goody Tonight Show</h2>
    <p style="color: #ebdcf9; font-size: 0.88rem; margin-bottom: 14px;">Select your contestant profile to activate camera, audio, and companion game pad:</p>
    <button class="btn-select btn-jake" id="btn-jake">I am Contestant 1 (Jake)</button>
    <button class="btn-select btn-june" id="btn-june">I am Contestant 2 (June)</button>
  </div>

  <main id="live-stage-portal">
    <div class="badge-bar">
      <span id="role-tag" style="color: #00f0ff;">CONNECTING...</span>
      <span style="color: #39ff14;">🔴 LIVE BROADCAST</span>
    </div>

    <div class="screens-container">
      <video id="studio-stream-video" autoplay playsinline muted></video>
      <video id="local-selfie-pip" autoplay playsinline muted></video>
    </div>

    <div id="timer-display"></div>

    <div class="action-panel">
      <button id="btn-roll-dice" disabled>🎲 ROLL DICE (LOCKED)</button>
      <div id="dice-result-pill">Waiting for host instructions...</div>

      <div class="dpad-section">
        <div class="dpad-label">🧸 Audience Plushie D-PAD</div>
        <div class="dpad-grid">
          <div></div>
          <button class="dpad-btn" id="dpad-fwd">▲</button>
          <div></div>
          <button class="dpad-btn" id="dpad-left">◀</button>
          <button class="dpad-btn" id="dpad-back">▼</button>
          <button class="dpad-btn" id="dpad-right">▶</button>
        </div>
      </div>
    </div>
  </main>

  <script src="https://unpkg.com/peerjs@1.5.4/dist/peerjs.min.js"></script>
  <script>
    let localStream = null;
    let peer = null;
    let dataConn = null;
    let contestantId = "";
    let contestantName = "";
    let hasRolled = false;
    let countdownInterval = null;

    const setupCard = document.getElementById('setup-card');
    const liveStagePortal = document.getElementById('live-stage-portal');
    const localSelfiePip = document.getElementById('local-selfie-pip');
    const studioStreamVideo = document.getElementById('studio-stream-video');
    const roleTag = document.getElementById('role-tag');
    const dicePill = document.getElementById('dice-result-pill');
    const timerDisplay = document.getElementById('timer-display');
    const btnRollDice = document.getElementById('btn-roll-dice');

    document.getElementById('btn-jake').addEventListener('click', () => joinGame("goody-contestant-1", "Jake"));
    document.getElementById('btn-june').addEventListener('click', () => joinGame("goody-contestant-2", "June"));

    async function joinGame(id, name) {
      contestantId = id;
      contestantName = name;
      setupCard.style.display = 'none';
      liveStagePortal.style.display = 'flex';
      roleTag.textContent = `${name.toUpperCase()} (CONTESTANT)`;

      try {
        localStream = await navigator.mediaDevices.getUserMedia({
          video: { facingMode: "user", width: { ideal: 640 }, height: { ideal: 480 } },
          audio: { echoCancellation: true, noiseSuppression: true }
        });
        localSelfiePip.srcObject = localStream;

        peer = new Peer(contestantId);

        peer.on('open', () => {
          const call = peer.call("goody-main-studio", localStream, {
            metadata: { contestant: contestantId, name: contestantName }
          });

          call.on('stream', (returnStudioStream) => {
            studioStreamVideo.srcObject = returnStudioStream;
            studioStreamVideo.play().catch(e => console.log(e));
          });

          dataConn = peer.connect("goody-main-studio", {
            metadata: { contestant: contestantId, name: contestantName }
          });

          dataConn.on('open', () => {
            dicePill.textContent = "Connected! Standby for show start...";
          });

          dataConn.on('data', (data) => {
            if (data.type === "START_DICE_COUNTDOWN") {
              startTenSecondRoll();
            } else if (data.type === "ROUND_WINNER") {
              timerDisplay.textContent = "";
              dicePill.textContent = `${data.winnerName.toUpperCase()} GOES FIRST! (${data.p1Roll} vs ${data.p2Roll})`;
            }
          });
        });

      } catch (err) {
        alert("Camera & microphone permissions required: " + err.message);
      }
    }

    function startTenSecondRoll() {
      hasRolled = false;
      btnRollDice.disabled = false;
      btnRollDice.classList.add('active-roll');
      btnRollDice.textContent = "🎲 ROLL DICE NOW!";

      let timeLeft = 10;
      timerDisplay.textContent = `⏱️ TIME TO ROLL: ${timeLeft}s`;

      if (countdownInterval) clearInterval(countdownInterval);
      countdownInterval = setInterval(() => {
        timeLeft--;
        if (timeLeft > 0) {
          timerDisplay.textContent = `⏱️ TIME TO ROLL: ${timeLeft}s`;
        } else {
          clearInterval(countdownInterval);
          timerDisplay.textContent = "TIME EXPIRED!";
          if (!hasRolled) {
            executeRoll(true);
          }
        }
      }, 1000);
    }

    function executeRoll(isAuto = false) {
      if (hasRolled) return;
      hasRolled = true;
      btnRollDice.disabled = true;
      btnRollDice.classList.remove('active-roll');
      btnRollDice.textContent = "DICE ROLLED!";

      const rollValue = Math.floor(Math.random() * 6) + 1;
      dicePill.textContent = isAuto ? `⏱️ Time's up! Auto-rolled: ${rollValue}` : `🎲 You rolled: ${rollValue}!`;

      if (dataConn && dataConn.open) {
        dataConn.send({
          type: "PLAYER_ROLLED_DICE",
          contestant: contestantId,
          name: contestantName,
          roll: rollValue
        });
      }
    }

    btnRollDice.addEventListener('click', () => executeRoll(false));

    function sendPlushieMove(direction) {
      if (dataConn && dataConn.open) {
        dataConn.send({
          type: "PLUSHIE_MOVE",
          contestant: contestantId,
          direction: direction
        });
      }
    }

    const bindDpad = (btnId, dir) => {
      const el = document.getElementById(btnId);
      el.addEventListener('touchstart', (e) => { e.preventDefault(); sendPlushieMove(dir); });
      el.addEventListener('mousedown', () => sendPlushieMove(dir));
    };

    bindDpad('dpad-fwd', 'FORWARD');
    bindDpad('dpad-back', 'BACK');
    bindDpad('dpad-left', 'LEFT');
    bindDpad('dpad-right', 'RIGHT');
  </script>
</body>
</html>
