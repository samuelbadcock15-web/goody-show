<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>Goody Tonight Show - Contestant 1 (Jake)</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; user-select: none; -webkit-user-select: none; }
    html, body {
      width: 100%; height: 100%; height: 100dvh; overflow: hidden;
      background: #090314; color: #fff; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
    }
    body { display: flex; flex-direction: column; align-items: center; padding: 6px; }

    #tap-to-enter-card {
      width: 100%; max-width: 400px; background: #190833; border: 2px solid #0984e3;
      border-radius: 16px; padding: 24px 20px; text-align: center; margin-top: 30px;
      box-shadow: 0 0 25px rgba(9, 132, 227, 0.3);
    }
    .passcode-box {
      width: 100%; padding: 12px; margin: 14px 0 8px 0; border-radius: 8px;
      border: 2px solid #0984e3; background: #0a0314; color: #ffda66;
      font-size: 1.25rem; font-weight: bold; text-align: center; letter-spacing: 4px;
    }
    .passcode-box:focus { outline: none; border-color: #00f0ff; }
    .btn-enter {
      width: 100%; padding: 15px; margin-top: 8px; border-radius: 12px; border: none;
      font-size: 1rem; font-weight: 900; text-transform: uppercase; cursor: pointer;
      color: #fff; background: linear-gradient(180deg, #0984e3, #06528d);
      box-shadow: 0 0 15px rgba(9, 132, 227, 0.4);
    }

    #live-stage-portal {
      width: 100%; max-width: 440px; height: 100%; display: none;
      flex-direction: column; justify-content: space-between; gap: 4px;
    }
    .badge-bar {
      display: flex; justify-content: space-between; align-items: center;
      background: #18092d; padding: 4px 8px; border-radius: 6px;
      font-family: monospace; font-size: 0.72rem; flex-shrink: 0;
    }
    .volume-container { display: flex; align-items: center; gap: 4px; }
    .volume-slider { width: 65px; height: 12px; accent-color: #39ff14; cursor: pointer; }

    .screens-container {
      position: relative; width: 100%; aspect-ratio: 16 / 9; max-height: 25vh;
      background: #000; border: 2px solid #0984e3; border-radius: 10px; overflow: hidden;
      touch-action: none; flex-shrink: 0; margin: 0 auto;
    }
    #studio-stream-video { width: 100%; height: 100%; object-fit: cover; pointer-events: none; }
    #local-selfie-pip {
      position: absolute; bottom: 4px; right: 4px; width: 26%; aspect-ratio: 4 / 3;
      border: 2px solid #39ff14; border-radius: 6px; object-fit: cover;
      transform: scaleX(-1); background: #111; z-index: 5; pointer-events: none;
    }

    #turn-banner {
      width: 100%; padding: 5px 8px; border-radius: 6px; text-align: center;
      font-weight: 900; font-size: 0.75rem; font-family: monospace; text-transform: uppercase;
      display: none; flex-shrink: 0;
    }
    .turn-mine { background: #00b894; color: #fff; border: 1.5px solid #55efc4; }
    .turn-theirs { background: #2d1847; color: #dfe6e9; border: 1.5px solid #636e72; }

    #status-pill { text-align: center; font-family: monospace; font-size: 0.78rem; color: #39ff14; min-height: 18px; }

    #btn-roll-dice {
      width: 100%; padding: 10px; background: #444; border: 2px solid #777; border-radius: 10px;
      font-size: 0.95rem; font-weight: 900; color: #888; text-transform: uppercase; cursor: not-allowed;
    }
    #btn-roll-dice.active-roll {
      background: linear-gradient(180deg, #fdcb6e, #e17055); border-color: #ffeaa7; color: #2d3436; cursor: pointer;
    }
  </style>
</head>
<body>

  <!-- Entry Passcode Gate -->
  <div id="tap-to-enter-card">
    <h2 style="color: #ffda66; margin-bottom: 4px; font-size: 1.25rem;">Contestant 1 (Jake)</h2>
    <p style="color: #00f0ff; font-weight: bold; font-size: 0.82rem;">LEFT SCREEN • LONDON (18+ ONLY)</p>
    
    <input type="password" id="passcode-input" class="passcode-box" placeholder="ENTER 4-DIGIT PIN" maxlength="6" autocomplete="off">
    <div id="passcode-error" style="color: #ff7675; font-size: 0.78rem; font-weight: bold; min-height: 18px; margin-bottom: 4px;"></div>

    <button class="btn-enter" id="btn-enter-jake">ENTER LIVE STAGE</button>
  </div>

  <!-- Live Contestant Workspace -->
  <main id="live-stage-portal">
    <div class="badge-bar">
      <span style="color: #00f0ff;">JAKE (P1)</span>
      <div class="volume-container">
        <span>🔊</span>
        <input type="range" id="vol-slider" class="volume-slider" min="0" max="1" step="0.05" value="1">
      </div>
      <span style="color: #39ff14;">🔴 LIVE</span>
    </div>

    <div class="screens-container">
      <video id="studio-stream-video" autoplay playsinline></video>
      <video id="local-selfie-pip" autoplay playsinline muted></video>
    </div>

    <div id="turn-banner"></div>
    <div id="status-pill">Waiting for host...</div>

    <button id="btn-roll-dice" disabled>🎲 ROLL DICE (LOCKED)</button>
  </main>

  <script src="https://unpkg.com/peerjs@1.5.4/dist/peerjs.min.js"></script>
  <script>
    const contestantId = "goody-contestant-1";
    const contestantName = "Jake";

    let localStream = null;
    let peer = null;
    let dataConn = null;
    let audioContext = null;
    let gainNode = null;
    let currentMasterVolume = 1.0;

    const passcodeInput = document.getElementById('passcode-input');
    const passcodeError = document.getElementById('passcode-error');
    const tapCard = document.getElementById('tap-to-enter-card');
    const liveStagePortal = document.getElementById('live-stage-portal');
    const localSelfiePip = document.getElementById('local-selfie-pip');
    const studioStreamVideo = document.getElementById('studio-stream-video');
    const turnBanner = document.getElementById('turn-banner');
    const statusPill = document.getElementById('status-pill');
    const btnRollDice = document.getElementById('btn-roll-dice');
    const volSlider = document.getElementById('vol-slider');

    // Dynamic Verification Handshake against goody-admin-panel
    function verifyPasscodeWithAdmin() {
      const entered = passcodeInput.value.trim();
      if (!entered) {
        passcodeError.textContent = "PLEASE ENTER 4-DIGIT PIN";
        return;
      }

      passcodeError.style.color = "#00f0ff";
      passcodeError.textContent = "Verifying with Admin...";

      const tempPeer = new Peer();
      tempPeer.on('open', () => {
        const adminConn = tempPeer.connect('goody-admin-panel');

        adminConn.on('open', () => {
          adminConn.send({ type: 'VERIFY_PASSCODE', code: entered, contestant: contestantId });
        });

        adminConn.on('data', (res) => {
          if (res.type === 'AUTH_SUCCESS') {
            passcodeError.textContent = '';
            tempPeer.destroy();
            unlockAudio();
            startLiveContestantPipeline();
          } else {
            passcodeError.style.color = "#ff7675";
            passcodeError.textContent = "❌ INCORRECT PASSCODE";
            passcodeInput.value = '';
            passcodeInput.focus();
            tempPeer.destroy();
          }
        });

        setTimeout(() => {
          if (passcodeError.textContent === "Verifying with Admin...") {
            passcodeError.style.color = "#ff7675";
            passcodeError.textContent = "⚠️ Admin offline. Producer must open admin.html";
            tempPeer.destroy();
          }
        }, 4000);
      });
    }

    document.getElementById('btn-enter-jake').addEventListener('click', verifyPasscodeWithAdmin);
    passcodeInput.addEventListener('keydown', (e) => { if (e.key === 'Enter') verifyPasscodeWithAdmin(); });

    function unlockAudio() {
      audioContext = new (window.AudioContext || window.webkitAudioContext)();
      if (audioContext.state === 'suspended') audioContext.resume();
    }

    volSlider.addEventListener('input', (e) => {
      currentMasterVolume = parseFloat(e.target.value);
      studioStreamVideo.volume = currentMasterVolume;
      if (gainNode) gainNode.gain.setValueAtTime(currentMasterVolume, audioContext.currentTime);
    });

    async function startLiveContestantPipeline() {
      tapCard.style.display = 'none';
      liveStagePortal.style.display = 'flex';

      try {
        localStream = await navigator.mediaDevices.getUserMedia({
          video: { facingMode: "user", width: { ideal: 640 }, height: { ideal: 480 } },
          audio: { echoCancellation: true, noiseSuppression: true }
        });
        localSelfiePip.srcObject = localStream;

        peer = new Peer(contestantId);
        peer.on('open', () => {
          const call = peer.call("goody-main-studio", localStream, {
            metadata: { contestant: contestantId, name: contestantName }
          });

          call.on('stream', (studioStream) => {
            studioStreamVideo.srcObject = studioStream;
            studioStreamVideo.volume = currentMasterVolume;
            studioStreamVideo.play().catch(console.error);
          });

          dataConn = peer.connect("goody-main-studio", {
            metadata: { contestant: contestantId, name: contestantName }
          });

          dataConn.on('open', () => {
            statusPill.textContent = "Connected to Studio!";
          });

          dataConn.on('data', (data) => {
            if (data.type === 'ENABLE_TURN_ROLL') {
              const isMe = data.activeContestantId === contestantId;
              turnBanner.style.display = 'block';
              turnBanner.className = isMe ? 'turn-mine' : 'turn-theirs';
              turnBanner.textContent = isMe ? "👉 YOUR TURN TO ROLL!" : `⏳ ${data.activeContestantName}'S TURN`;

              if (isMe) {
                btnRollDice.disabled = false;
                btnRollDice.classList.add('active-roll');
                btnRollDice.textContent = "🎲 ROLL DICE NOW!";
              }
            }
          });
        });
      } catch (err) {
        alert("Camera/Mic required: " + err.message);
      }
    }

    btnRollDice.addEventListener('click', () => {
      btnRollDice.disabled = true;
      btnRollDice.classList.remove('active-roll');
      const roll = Math.floor(Math.random() * 6) + 1;
      statusPill.textContent = `🎲 You rolled: ${roll}`;
      if (dataConn && dataConn.open) {
        dataConn.send({ type: 'PLAYER_ROLLED_DICE', contestant: contestantId, name: contestantName, roll: roll });
      }
    });
  </script>
</body>
</html>
