<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>Goody Tonight Show - Contestant</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; user-select: none; }
    body {
      background: #080312; color: #fff;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      min-height: 100vh; display: flex; flex-direction: column; align-items: center; padding: 14px;
    }
    #setup-card {
      width: 100%; max-width: 480px; background: #1b0933; border: 2px solid #ff79b0;
      border-radius: 16px; padding: 20px; text-align: center; margin-top: 20px;
    }
    .btn {
      width: 100%; padding: 16px; margin: 10px 0; border-radius: 12px; border: none;
      font-size: 1rem; font-weight: bold; text-transform: uppercase; cursor: pointer; color: #fff;
    }
    .btn-jake { background: #0984e3; }
    .btn-june { background: #d63031; }
    #viewfinder {
      width: 100%; max-width: 480px; aspect-ratio: 4/3; background: #000;
      border: 2px solid #00f0ff; border-radius: 12px; overflow: hidden; display: none; margin-top: 15px;
    }
    video { width: 100%; height: 100%; object-fit: cover; transform: scaleX(-1); }
    #status { margin-top: 15px; font-family: monospace; color: #39ff14; }
  </style>
</head>
<body>
  <div id="setup-card">
    <h2 style="color: #ffda66; margin-bottom: 12px;">Join Game Show</h2>
    <p style="margin-bottom: 16px; color: #ebdcf9;">Select your screen to connect your camera and microphone directly into the studio:</p>
    <button class="btn btn-jake" id="btn-jake">I am Contestant 1 (Jake - Left Screen)</button>
    <button class="btn btn-june" id="btn-june">I am Contestant 2 (June - Right Screen)</button>
  </div>

  <div id="viewfinder">
    <!-- Local preview is kept muted so you do not hear an echo in your own phone -->
    <video id="local-video" autoplay playsinline muted></video>
  </div>
  <div id="status">STATUS: STANDBY</div>

  <script src="https://unpkg.com/peerjs@1.5.4/dist/peerjs.min.js"></script>
  <script>
    let localStream = null;
    let peer = null;
    const statusText = document.getElementById('status');

    document.getElementById('btn-jake').addEventListener('click', () => joinStudio("goody-contestant-1", "Jake"));
    document.getElementById('btn-june').addEventListener('click', () => joinStudio("goody-contestant-2", "June"));

    async function joinStudio(slotId, name) {
      document.getElementById('setup-card').style.display = 'none';
      document.getElementById('viewfinder').style.display = 'block';
      statusText.textContent = "STATUS: REQUESTING CAMERA & MIC...";

      try {
        // AUDIO IS NOW ENABLED (echoCancellation prevents studio feedback)
        localStream = await navigator.mediaDevices.getUserMedia({
          video: { facingMode: "user", width: { ideal: 640 }, height: { ideal: 480 } },
          audio: { echoCancellation: true, noiseSuppression: true }
        });

        document.getElementById('local-video').srcObject = localStream;
        statusText.textContent = "STATUS: CONNECTING TO STUDIO...";

        peer = new Peer();
        peer.on('open', () => {
          statusText.textContent = `STATUS: DIALING STUDIO AS ${name.toUpperCase()}...`;
          const call = peer.call("goody-main-studio", localStream, {
            metadata: { contestant: slotId, name: name }
          });
          call.on('close', () => { statusText.textContent = "STATUS: DISCONNECTED"; });
          statusText.textContent = `STATUS: 🔴 LIVE ON STAGE (${name.toUpperCase()}) [MIC ON]`;
        });
      } catch (err) {
        statusText.textContent = "DEVICE ERROR: " + err.message;
        alert("Camera and microphone permissions are required to stream into the studio!");
      }
    }
  </script>
</body>
</html>
