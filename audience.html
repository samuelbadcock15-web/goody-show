<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>Goody Tonight Show - Live Audience Experience</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; user-select: none; -webkit-user-select: none; }
    html, body {
      width: 100%; height: 100%; height: 100dvh;
      overflow: hidden; background: #06020c; color: #fff;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
    }
    #canvas3d { width: 100%; height: 100%; display: block; position: absolute; top: 0; left: 0; z-index: 1; }

    /* ENTRY MODAL */
    #entry-modal {
      position: absolute; top: 0; left: 0; width: 100%; height: 100%;
      background: rgba(6, 2, 14, 0.95); display: flex; flex-direction: column;
      justify-content: center; align-items: center; z-index: 100; padding: 16px;
    }
    .entry-card {
      background: #17072b; border: 2.5px solid #d4af37; border-radius: 18px;
      padding: 26px 22px; width: 100%; max-width: 380px; text-align: center;
      box-shadow: 0 0 30px rgba(212, 175, 55, 0.35);
    }
    .badge-audience {
      display: inline-block; padding: 4px 14px; background: #99001a; color: #ffda66;
      font-family: monospace; font-weight: 900; font-size: 0.82rem; border-radius: 6px;
      margin-bottom: 12px; letter-spacing: 1.5px; border: 1px solid #d4af37;
    }
    .text-field {
      width: 100%; padding: 12px; font-size: 1.05rem; font-weight: bold; background: #090314;
      color: #00f0ff; border: 2px solid #a29bfe; border-radius: 10px; outline: none;
      margin-bottom: 14px; text-align: center;
    }
    .text-field:focus { border-color: #00f0ff; }
    .btn-join {
      width: 100%; padding: 14px; border-radius: 12px; border: none; font-size: 1.05rem;
      font-weight: 900; text-transform: uppercase; cursor: pointer; color: #fff;
      background: linear-gradient(180deg, #d4af37, #b8860b); box-shadow: 0 3px 0 #6e5200;
    }
    .btn-join:active { transform: scale(0.98); }

    /* IN-GAME HUD */
    #spectator-ui {
      position: absolute; top: 0; left: 0; width: 100%; height: 100%;
      display: none; flex-direction: column; justify-content: space-between;
      pointer-events: none; z-index: 10; padding: 8px;
    }
    .top-bar {
      display: flex; justify-content: space-between; align-items: center;
      background: rgba(18, 7, 36, 0.90); border: 1.5px solid #d4af37; border-radius: 8px;
      padding: 6px 12px; font-family: monospace; font-size: 0.78rem; pointer-events: auto;
    }
    #location-pill { color: #39ff14; font-weight: bold; }

    #interaction-prompt {
      position: absolute; top: 20%; left: 50%; transform: translateX(-50%);
      background: rgba(18, 7, 36, 0.94); border: 2px solid #fdcb6e; border-radius: 10px;
      padding: 8px 18px; color: #ffda66; font-family: monospace; font-weight: bold;
      font-size: 0.82rem; display: none; pointer-events: auto; text-align: center;
      box-shadow: 0 0 18px rgba(253, 203, 110, 0.45);
    }

    #stage-synced-banner {
      background: rgba(22, 9, 44, 0.94); border: 2px solid #00f0ff; border-radius: 10px;
      padding: 8px 12px; margin: 6px auto; width: 100%; max-width: 440px; text-align: center;
      display: none; pointer-events: auto;
    }
    #stage-q-title { font-size: 0.75rem; color: #ffda66; font-weight: bold; font-family: monospace; }
    #stage-q-text { font-size: 0.84rem; color: #ffffff; margin: 4px 0 8px 0; font-weight: 600; line-height: 1.3; }

    /* CHAT */
    #chat-container {
      width: 100%; max-width: 420px; background: rgba(13, 5, 26, 0.88);
      border: 1.5px solid #d4af37; border-radius: 10px; display: flex; flex-direction: column;
      pointer-events: auto; margin-bottom: 6px; backdrop-filter: blur(4px);
    }
    #chat-header {
      padding: 6px 10px; background: #230a42; border-top-left-radius: 8px; border-top-right-radius: 8px;
      font-size: 0.75rem; font-weight: bold; color: #ffda66; display: flex; justify-content: space-between;
      align-items: center; cursor: pointer;
    }
    #chat-messages {
      height: 95px; overflow-y: auto; padding: 6px 8px; display: flex; flex-direction: column;
      gap: 4px; font-size: 0.78rem;
    }
    .chat-msg { word-break: break-word; line-height: 1.25; }
    .chat-author { font-weight: bold; color: #39ff14; font-family: monospace; }
    .chat-author.is-self { color: #00f0ff; }
    .chat-author.is-host { color: #ff7675; }
    .chat-input-row { display: flex; border-top: 1px solid #442266; padding: 4px; gap: 4px; }
    #chat-text-input {
      flex: 1; background: #080313; border: 1px solid #a29bfe; border-radius: 6px;
      color: #fff; padding: 6px 8px; font-size: 0.82rem; outline: none;
    }
    #btn-send-chat {
      background: #d4af37; border: none; border-radius: 6px; color: #111; font-weight: bold;
      font-size: 0.75rem; padding: 0 12px; cursor: pointer;
    }

    /* CONTROLS */
    .controls-wrapper {
      display: flex; justify-content: space-between; align-items: flex-end;
      width: 100%; pointer-events: none; padding: 0 4px;
    }
    .dpad-section {
      background: rgba(20, 7, 40, 0.90); border: 1.5px solid #d4af37; border-radius: 10px;
      padding: 4px; pointer-events: auto; display: flex; flex-direction: column; align-items: center;
    }
    .dpad-grid { display: grid; grid-template-columns: 44px 44px 44px; grid-template-rows: 32px 32px; gap: 4px; }
    .dpad-btn {
      background: #2b1154; border: 1.5px solid #d4af37; border-radius: 6px; color: #fff;
      font-size: 1rem; font-weight: bold; display: flex; justify-content: center; align-items: center;
      cursor: pointer;
    }
  </style>
</head>
<body>
  <canvas id="canvas3d"></canvas>

  <div id="entry-modal">
    <div class="entry-card">
      <div class="badge-audience">VIP PASS</div>
      <h2 style="color: #ffda66; font-size: 1.35rem; margin-bottom: 8px;">The Goody Tonight Show</h2>
      <p style="color: #ebdcf9; font-size: 0.85rem; margin-bottom: 16px;">
        Step into the audience seating and watch the live studio broadcast!
      </p>
      <input type="text" id="audience-name-input" class="text-field" maxlength="14" placeholder="Your Name" autocomplete="off" />
      <button class="btn-join" id="btn-join-studio">Enter Audience Bleachers</button>
    </div>
  </div>

  <main id="spectator-ui">
    <div class="top-bar">
      <span id="user-display-name" style="color:#00f0ff;">SPECTATOR</span>
      <span id="location-pill">LOCATION: STUDIO BLEACHERS</span>
      <span id="show-clock-pill" style="color:#ffda66;">SHOW: 20:00</span>
    </div>

    <div id="stage-synced-banner">
      <div id="stage-q-title">CURRENT QUESTION</div>
      <div id="stage-q-text">Standby for next question...</div>
    </div>

    <div style="display:flex; flex-direction:column; align-items:center; width:100%;">
      <div id="chat-container">
        <div id="chat-header">
          <span>COMMUNAL AUDIENCE CHAT</span>
        </div>
        <div id="chat-messages">
          <div class="chat-msg" style="color:#aaa; font-style:italic;">Welcome to the broadcast! Have a great taping.</div>
        </div>
        <div class="chat-input-row">
          <input type="text" id="chat-text-input" maxlength="120" placeholder="Say something..." autocomplete="off" />
          <button id="btn-send-chat">SEND</button>
        </div>
      </div>

      <div class="controls-wrapper">
        <div class="dpad-section">
          <div class="dpad-grid">
            <div></div>
            <button class="dpad-btn" id="dpad-fwd">▲</button>
            <div></div>
            <button class="dpad-btn" id="dpad-left">◀</button>
            <button class="dpad-btn" id="dpad-back">▼</button>
            <button class="dpad-btn" id="dpad-right">▶</button>
          </div>
        </div>
      </div>
    </div>
  </main>

  <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
  <script src="https://unpkg.com/peerjs@1.5.4/dist/peerjs.min.js"></script>

  <script>
    const spectatorSessionToken = 'aud_' + Math.random().toString(36).substring(2, 10);
    const deviceHardwareId = 'hw_' + Math.random().toString(36).substring(2, 9);

    const entryModal = document.getElementById('entry-modal');
    const audienceNameInput = document.getElementById('audience-name-input');
    const btnJoinStudio = document.getElementById('btn-join-studio');
    const spectatorUi = document.getElementById('spectator-ui');
    const userDisplayName = document.getElementById('user-display-name');
    const showClockPill = document.getElementById('show-clock-pill');
    const stageSyncedBanner = document.getElementById('stage-synced-banner');
    const stageQTitle = document.getElementById('stage-q-title');
    const stageQText = document.getElementById('stage-q-text');

    const chatMessages = document.getElementById('chat-messages');
    const chatTextInput = document.getElementById('chat-text-input');
    const btnSendChat = document.getElementById('btn-send-chat');

    let audienceNickname = "Guest " + Math.floor(100 + Math.random() * 900);
    let peer = null;
    let dataConn = null;
    let lastMessageSentTime = 0;

    // INCOMING WEBRTC LIVE MONITOR STREAM FROM HOST
    const remoteStageVideo = document.createElement('video');
    remoteStageVideo.autoplay = true;
    remoteStageVideo.playsInline = true;
    remoteStageVideo.muted = true;
    remoteStageVideo.setAttribute('playsinline', '');

    let hasLiveMonitorFeed = false;

    btnJoinStudio.addEventListener('click', () => {
      const entered = audienceNameInput.value.trim();
      if (entered.length > 0) audienceNickname = entered;
      userDisplayName.textContent = audienceNickname.toUpperCase();
      entryModal.style.display = 'none';
      spectatorUi.style.display = 'flex';
      connectToStudio();
    });

    function connectToStudio() {
      peer = new Peer();
      peer.on('open', () => {
        dataConn = peer.connect('goody-main-studio', {
          metadata: {
            role: 'AUDIENCE',
            name: audienceNickname,
            sessionToken: spectatorSessionToken,
            hardwareId: deviceHardwareId
          }
        });

        dataConn.on('data', (data) => {
          if (data.type === 'SYNC_MATCH_TIMER') {
            showClockPill.textContent = `SHOW: ${data.timeStr}`;
          } else if (data.type === 'SHOW_QUESTION_LOCKED') {
            stageSyncedBanner.style.display = 'block';
            stageQTitle.textContent = `${data.question.country.toUpperCase()} [${data.activeContestantName.toUpperCase()}]`;
            stageQText.textContent = data.question.text || data.question.q;
          } else if (data.type === 'AUDIENCE_CHAT_BROADCAST') {
            addChatMessage(data.author, data.text);
          }
        });

        // Request live stage monitor feed from the host
        try {
          const dummyCanvas = document.createElement('canvas');
          dummyCanvas.width = 16; dummyCanvas.height = 16;
          const dummyStream = dummyCanvas.captureStream(1);

          const mediaCall = peer.call('goody-main-studio', dummyStream, {
            metadata: { role: 'AUDIENCE' }
          });

          mediaCall.on('stream', (incomingMonitorStream) => {
            remoteStageVideo.srcObject = incomingMonitorStream;
            remoteStageVideo.muted = true;
            remoteStageVideo.play().then(() => {
              hasLiveMonitorFeed = true;
              stageScreenMaterial.map = new THREE.VideoTexture(remoteStageVideo);
              stageScreenMaterial.needsUpdate = true;
            }).catch(() => {
              hasLiveMonitorFeed = true;
              stageScreenMaterial.map = new THREE.VideoTexture(remoteStageVideo);
              stageScreenMaterial.needsUpdate = true;
            });
          });
        } catch (err) {
          console.error("Media call error:", err);
        }
      });
    }

    function addChatMessage(author, text) {
      const msgEl = document.createElement('div');
      msgEl.className = 'chat-msg';
      msgEl.innerHTML = `<strong style="color:#00f0ff;">${author}:</strong> ${text}`;
      chatMessages.appendChild(msgEl);
      chatMessages.scrollTop = chatMessages.scrollHeight;
    }

    function sendChatMessage() {
      const text = chatTextInput.value.trim();
      if (!text) return;
      const now = performance.now();
      if (now - lastMessageSentTime < 2500) return;
      lastMessageSentTime = now;

      addChatMessage(audienceNickname, text);
      chatTextInput.value = '';

      if (dataConn && dataConn.open) {
        dataConn.send({
          type: 'AUDIENCE_CHAT_MESSAGE',
          author: audienceNickname,
          text: text,
          sessionToken: spectatorSessionToken,
          hardwareId: deviceHardwareId
        });
      }
    }
    btnSendChat.addEventListener('click', sendChatMessage);

    // 3D SCENE
    const scene = new THREE.Scene();
    scene.background = new THREE.Color(0x040208);

    const camera = new THREE.PerspectiveCamera(60, window.innerWidth / window.innerHeight, 0.1, 100);
    // Positioned right in the audience bleachers looking down at the stage
    camera.position.set(0, 5.2, 5.5);
    camera.lookAt(0, 3.2, -4.5);

    const canvas = document.getElementById('canvas3d');
    const renderer = new THREE.WebGLRenderer({ canvas, antialias: true });
    renderer.setSize(window.innerWidth, window.innerHeight);

    const amb = new THREE.AmbientLight(0xffffff, 1.2); scene.add(amb);

    // STAGE AND BOARD
    const miniDiorama = new THREE.Group();
    miniDiorama.position.set(0, 0, -4.5);

    const feltCarpet = new THREE.Mesh(new THREE.CylinderGeometry(6.5, 6.5, 0.1, 32), new THREE.MeshStandardMaterial({ color: 0x271147 }));
    miniDiorama.add(feltCarpet);

    // THE 2 MAIN BACKSTAGE SCREENS (Now textures directly from host's live video stream!)
    const stageScreenMaterial = new THREE.MeshBasicMaterial({ color: 0x111111 });
    const studioBackScreenMesh = new THREE.Mesh(new THREE.PlaneGeometry(6.4, 2.8), stageScreenMaterial);
    studioBackScreenMesh.position.set(0, 3.4, -4.5);
    miniDiorama.add(studioBackScreenMesh);

    scene.add(miniDiorama);

    window.addEventListener('resize', () => {
      camera.aspect = window.innerWidth / window.innerHeight;
      camera.updateProjectionMatrix();
      renderer.setSize(window.innerWidth, window.innerHeight);
    });

    function animate() {
      requestAnimationFrame(animate);
      renderer.render(scene, camera);
    }
    animate();
  </script>
</body>
</html>
