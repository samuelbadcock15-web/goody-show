<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>Goody Tonight Show - Contestant 1</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; user-select: none; -webkit-user-select: none; }
    html, body { width: 100%; height: 100%; height: 100dvh; overflow: hidden; background: #090314; color: #fff; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; }
    body { display: flex; flex-direction: column; align-items: center; padding: 6px; }

    #setup-card { width: 100%; max-width: 420px; background: #1b0933; border: 2px solid #0984e3; border-radius: 16px; padding: 20px; text-align: center; margin-top: 14px; }
    .badge-podium { display: inline-block; padding: 4px 10px; background: #0984e3; color: #fff; font-family: monospace; font-weight: 900; font-size: 0.8rem; border-radius: 6px; margin-bottom: 10px; }
    .input-label { font-size: 0.72rem; font-family: monospace; color: #ffda66; text-transform: uppercase; margin-bottom: 3px; display: block; text-align: left; }
    .form-group { margin-bottom: 10px; text-align: left; }
    #passcode-input { width: 100%; padding: 8px; font-size: 1.6rem; font-family: monospace; font-weight: 900; letter-spacing: 8px; text-align: center; background: #080313; color: #39ff14; border: 2px solid #a29bfe; border-radius: 10px; outline: none; }
    .text-field { width: 100%; padding: 10px 12px; font-size: 1rem; font-weight: bold; background: #080313; color: #00f0ff; border: 2px solid #a29bfe; border-radius: 10px; outline: none; }
    .btn-enter { width: 100%; padding: 14px; margin-top: 6px; border-radius: 12px; border: none; font-size: 1rem; font-weight: 900; text-transform: uppercase; cursor: pointer; color: #fff; background: linear-gradient(180deg, #0984e3, #0652dd); }

    #live-stage-portal { width: 100%; max-width: 440px; height: 100%; display: none; flex-direction: column; justify-content: space-between; gap: 4px; }
    .badge-bar { display: flex; justify-content: space-between; align-items: center; background: #18092d; padding: 4px 8px; border-radius: 6px; font-family: monospace; font-size: 0.72rem; flex-shrink: 0; }
    #mic-status-badge { display: none; background: #27ae60; color: #fff; padding: 2px 6px; border-radius: 4px; font-weight: 900; }
    .screens-container { position: relative; width: 100%; aspect-ratio: 16 / 9; max-height: 25vh; background: #000; border: 2px solid #ffda66; border-radius: 10px; overflow: hidden; flex-shrink: 0; margin: 0 auto; }
    #studio-stream-video { width: 100%; height: 100%; object-fit: cover; pointer-events: none; }
    #local-selfie-pip { position: absolute; bottom: 4px; right: 4px; width: 26%; aspect-ratio: 4 / 3; border: 2px solid #39ff14; border-radius: 6px; object-fit: cover; transform: scaleX(-1); background: #111; z-index: 5; pointer-events: none; }

    #turn-banner { width: 100%; padding: 5px 8px; border-radius: 6px; text-align: center; font-weight: 900; font-size: 0.75rem; font-family: monospace; text-transform: uppercase; display: none; flex-shrink: 0; }
    .turn-mine { background: #00b894; color: #fff; border: 1.5px solid #55efc4; }
    .turn-theirs { background: #2d1847; color: #dfe6e9; border: 1.5px solid #636e72; }

    #status-pill { text-align: center; font-family: monospace; font-size: 0.78rem; color: #39ff14; min-height: 18px; flex-shrink: 0; }
    #btn-roll-dice { width: 100%; padding: 10px; background: #444; border: 2px solid #777; border-radius: 10px; font-size: 0.95rem; font-weight: 900; color: #888; text-transform: uppercase; cursor: not-allowed; flex-shrink: 0; }
    #btn-roll-dice.active-roll { background: linear-gradient(180deg, #fdcb6e, #e17055); border-color: #ffeaa7; color: #2d3436; cursor: pointer; }

    #trivia-card { background: #190930; border: 2px solid #00f0ff; border-radius: 10px; padding: 8px; display: none; flex-direction: column; gap: 6px; flex-shrink: 1; }
    #q-country-tag { font-size: 0.75rem; font-weight: bold; color: #ffda66; text-transform: uppercase; }
    #q-text { font-size: 0.82rem; font-weight: 600; line-height: 1.3; color: #ffffff; background: rgba(0,0,0,0.35); padding: 6px; border-radius: 6px; }
    .options-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 6px; }
    .btn-opt { padding: 8px 6px; background: #2f1454; border: 1.5px solid #9c4dd6; border-radius: 8px; color: #fff; font-size: 0.75rem; font-weight: bold; text-align: left; cursor: not-allowed; opacity: 0.6; }
    .btn-opt.unlocked { cursor: pointer; opacity: 1; border-color: #00f0ff; }
  </style>
</head>
<body>
  <div id="setup-card">
    <div class="badge-podium">PODIUM 1</div>
    <h2 style="color: #ffda66; margin-bottom: 12px; font-size: 1.25rem;">The Goody Tonight Show</h2>
    <div class="form-group"><span class="input-label">4-Digit Code:</span><input type="text" id="passcode-input" maxlength="4" placeholder="0000" inputmode="numeric" /></div>
    <div class="form-group"><span class="input-label">First Name:</span><input type="text" id="name-input" class="text-field" maxlength="15" placeholder="Jake" /></div>
    <div class="form-group"><span class="input-label">City:</span><input type="text" id="city-input" class="text-field" maxlength="20" placeholder="London" /></div>
    <button class="btn-enter" id="btn-enter-studio">Enter Live Studio</button>
  </div>

  <main id="live-stage-portal">
    <div class="badge-bar">
      <span id="role-tag" style="color: #00f0ff;">CONNECTING...</span>
      <span id="mic-status-badge">🎙️ MIC LIVE</span>
      <span id="match-timer-badge" style="color: #ffda66;">20:00</span>
      <span style="color: #39ff14;">LIVE</span>
    </div>
    <div class="screens-container">
      <video id="studio-stream-video" autoplay playsinline></video>
      <video id="local-selfie-pip" autoplay playsinline muted></video>
    </div>
    <div id="turn-banner"></div>
    <div id="status-pill">Waiting for host...</div>
    <button id="btn-roll-dice" disabled>ROLL DICE (LOCKED)</button>
    <div id="trivia-card">
      <div style="display: flex; justify-content: space-between;"><span id="q-country-tag">COUNTRY</span><span id="q-timer">30s</span></div>
      <div id="q-text">Loading question...</div>
      <div class="options-grid">
        <button class="btn-opt" id="opt-0" disabled>A) ...</button>
        <button class="btn-opt" id="opt-1" disabled>B) ...</button>
        <button class="btn-opt" id="opt-2" disabled>C) ...</button>
        <button class="btn-opt" id="opt-3" disabled>D) ...</button>
      </div>
    </div>
  </main>

  <script src="https://unpkg.com/peerjs@1.5.4/dist/peerjs.min.js"></script>
  <script>
    const CONTESTANT_ID = "goody-contestant-1";
    let localStream = null, peer = null, dataConn = null, mediaCall = null;
    let hasRolled = false, currentQuestionData = null;

    function setLocalMicEnabled(enabled) {
      if (localStream && localStream.getAudioTracks().length > 0) localStream.getAudioTracks()[0].enabled = enabled;
      document.getElementById('mic-status-badge').style.display = enabled ? 'inline-block' : 'none';
    }

    document.getElementById('btn-enter-studio').addEventListener('click', async () => {
      const code = document.getElementById('passcode-input').value.trim();
      const name = document.getElementById('name-input').value.trim();
      const city = document.getElementById('city-input').value.trim() || "London";
      if (!/^\d{4}$/.test(code)) { alert("Enter 4-digit code."); return; }
      if (!name) { alert("Enter your name."); return; }

      document.getElementById('setup-card').style.display = 'none';
      document.getElementById('live-stage-portal').style.display = 'flex';

      try {
        localStream = await navigator.mediaDevices.getUserMedia({ video: true, audio: true });
        document.getElementById('local-selfie-pip').srcObject = localStream;
        setLocalMicEnabled(false);

        peer = new Peer();
        peer.on('open', () => {
          mediaCall = peer.call("goody-main-studio", localStream, { metadata: { contestant: CONTESTANT_ID, name, city, passcode: code } });
          mediaCall.on('stream', (stream) => { const v = document.getElementById('studio-stream-video'); v.srcObject = stream; v.muted = false; v.play(); });

          dataConn = peer.connect("goody-main-studio", { metadata: { contestant: CONTESTANT_ID, name, city, passcode: code } });
          dataConn.on('data', (data) => {
            if (data.type === "SET_MIC_STATE") setLocalMicEnabled(data.enabled);
            else if (data.type === "SYNC_MATCH_TIMER") document.getElementById('match-timer-badge').textContent = data.timeStr;
            else if (data.type === "ENABLE_TURN_ROLL") {
              setLocalMicEnabled(false);
              const btn = document.getElementById('btn-roll-dice');
              btn.style.display = 'block'; btn.disabled = false; btn.classList.add('active-roll'); btn.textContent = "ROLL DICE NOW!";
            } else if (data.type === "SHOW_QUESTION_LOCKED") {
              currentQuestionData = data.question;
              document.getElementById('trivia-card').style.display = 'flex';
              document.getElementById('q-country-tag').textContent = data.question.country;
              document.getElementById('q-text').textContent = data.question.q;
              data.question.options.forEach((opt, idx) => {
                document.getElementById(`opt-${idx}`).textContent = `${["A","B","C","D"][idx]}) ${opt}`;
              });
            } else if (data.type === "UNLOCK_QUESTION_INPUT") {
              document.querySelectorAll('.btn-opt').forEach(b => { b.disabled = false; b.classList.add('unlocked'); });
            }
          });
        });
      } catch (err) { alert("Cam/Mic error: " + err.message); }
    });

    document.getElementById('btn-roll-dice').addEventListener('click', () => {
      if (hasRolled) return; hasRolled = true;
      const roll = Math.floor(Math.random() * 6) + 1;
      document.getElementById('btn-roll-dice').disabled = true;
      if (dataConn && dataConn.open) dataConn.send({ type: "PLAYER_ROLLED_DICE", contestant: CONTESTANT_ID, roll });
    });

    document.querySelectorAll('.btn-opt').forEach((btn, idx) => {
      btn.addEventListener('click', () => {
        setLocalMicEnabled(false);
        document.querySelectorAll('.btn-opt').forEach(b => b.disabled = true);
        if (dataConn && dataConn.open) dataConn.send({ type: "PLAYER_ANSWERED", contestant: CONTESTANT_ID, chosenAnswer: currentQuestionData.options[idx] });
      });
    });
  </script>
</body>
</html>
