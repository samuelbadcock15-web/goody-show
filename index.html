<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>The Goody Tonight Show - Live Studio</title>
  <style>
    body, html {
      margin: 0; padding: 0; width: 100%; height: 100%;
      overflow: hidden; background-color: #05020a;
      font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
    }
    #canvas3d { width: 100%; height: 100%; display: block; }
    #crosshair {
      position: absolute; top: 50%; left: 50%; width: 8px; height: 8px;
      background: rgba(255, 255, 255, 0.85); border-radius: 50%;
      transform: translate(-50%, -50%); pointer-events: none;
      box-shadow: 0 0 8px #00f0ff; transition: transform 0.15s; z-index: 10;
    }
    #crosshair.hover-active { transform: translate(-50%, -50%) scale(2.2); background: #ff69b4; }
    #blocker {
      position: absolute; top: 0; left: 0; width: 100%; height: 100%;
      background: rgba(8, 4, 16, 0.9); display: flex; flex-direction: column;
      justify-content: center; align-items: center; color: #fff; z-index: 100; text-align: center;
    }
    #instructions-card {
      background: #1c0a32; border: 3px solid #ff79b0; border-radius: 18px;
      padding: 28px 40px; box-shadow: 0 0 35px rgba(255, 121, 176, 0.35); max-width: 560px; cursor: pointer;
    }
    h1 { color: #ffda66; margin-top: 0; font-size: 1.6rem; letter-spacing: 1.5px; }
    p { color: #ebdcf9; font-size: 0.92rem; line-height: 1.5; margin: 8px 0; }
    .key { background: #391563; padding: 2px 7px; border-radius: 4px; border: 1px solid #9c4dd6; font-weight: bold; color: #ff69b4; }
    #hud {
      position: absolute; top: 18px; left: 20px; background: rgba(22, 9, 44, 0.88);
      border: 2px solid #ff79b0; border-radius: 12px; padding: 12px 18px; color: #fff;
      font-family: monospace; font-size: 0.85rem; pointer-events: none; z-index: 20;
    }
    #countdown-pill { margin-top: 6px; font-weight: bold; color: #ffda66; font-size: 0.95rem; }
    #audience-pill { margin-top: 4px; font-weight: bold; color: #00f0ff; }
  </style>
</head>
<body>
  <div id="crosshair"></div>
  <div id="hud">
    <div class="hud-title" id="mode-title" style="color: #ffda66;">🏠 BEDROOM WORKSHOP</div>
    <div class="hud-sub" id="mode-sub">WebRTC Studio Host: ONLINE • FULL GAME LOOP READY</div>
    <div id="countdown-pill">⏳ BROADCAST STARTS IN: <span id="timer-val" style="color:#ff7675;">10s</span></div>
    <div id="audience-pill">👥 AUDIENCE WATCHING: <span id="audience-count" style="color:#39ff14;">1</span></div>
  </div>

  <div id="blocker">
    <div id="instructions-card">
      <h1>The Goody Tonight Show</h1>
      <p>Synchronized tiles & real-time stage question highlight board active!</p>
      <p><strong>Click Anywhere to Enter</strong></p>
      <p><span class="key">W</span> <span class="key">A</span> <span class="key">S</span> <span class="key">D</span> &nbsp;Walk around freely</p>
    </div>
  </div>

  <canvas id="canvas3d"></canvas>

  <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/controls/PointerLockControls.js"></script>
  <script src="https://unpkg.com/peerjs@1.5.4/dist/peerjs.min.js"></script>

  <script>
    let currentMode = 'BEDROOM';
    let studioPower = false;
    let showJake = false;
    let showJune = false;

    const videoJake = document.createElement('video');
    videoJake.autoplay = true; videoJake.playsInline = true; videoJake.muted = true;
    const videoJune = document.createElement('video');
    videoJune.autoplay = true; videoJune.playsInline = true; videoJune.muted = true;

    let gameState = "IDLE";
    let diceCountdown = 0;
    let diceInterval = null;
    let p1RollVal = null;
    let p2RollVal = null;

    let activePlayer = "goody-contestant-1";
    let activeQuestion = null;
    let questionTimer = 0;
    let questionInterval = null;
    let stageSelectedOption = null;
    let stageOptionStatus = null;

    let audienceCount = 1;
    const audienceCountEl = document.getElementById('audience-count');
    const countdownPill = document.getElementById('countdown-pill');
    const timerValEl = document.getElementById('timer-val');

    let autoStartSeconds = 10;
    let autoStartInterval = setInterval(() => {
      autoStartSeconds--;
      if (autoStartSeconds > 0) {
        timerValEl.textContent = `${autoStartSeconds}s`;
      } else {
        clearInterval(autoStartInterval);
        countdownPill.innerHTML = `🟢 <span style="color:#39ff14;">LIVE ON AIR!</span>`;
        if (!studioPower) bootStudio();
      }
      renderStageQuestionBoard();
    }, 1000);

    const INTRO_SPEECH = 
      "Hello, good evening, and welcome to The Goody Tonight Show! " +
      "I'm your host, Goody! " +
      "You are now part of the world's first and only televised self-exclusion game show! " +
      "Now, let's meet tonight's contestants! " +
      "Contestant number 1! This is Jake from London! " +
      "And let's meet contestant number 2! This is June from Nottingham! " +
      "Now we need to determine who moves first! " +
      "Contestants, you both have 10 seconds to roll your dice!";

    const COUNTRY_QUESTIONS = {
      "UK": [
        { q: "In the UK, before the 2019 stake reduction, what was the maximum stake per spin on a Fixed-Odds-Betting-Terminal?", options: ["£2", "£50", "£100", "£500"], ans: "£100", recap: "In April 2019, the UK reduced the maximum FOBT stake per spin from £100 down to £2 to combat severe harms." }
      ]
    };

    const scene = new THREE.Scene();
    scene.background = new THREE.Color(0x040208);
    scene.fog = new THREE.FogExp2(0x040208, 0.015);

    const camera = new THREE.PerspectiveCamera(65, window.innerWidth / window.innerHeight, 0.1, 150);
    camera.position.set(0, 5.5, 9);

    const canvas = document.getElementById('canvas3d');
    const renderer = new THREE.WebGLRenderer({ canvas, antialias: true, preserveDrawingBuffer: true });
    renderer.setSize(window.innerWidth, window.innerHeight);
    renderer.setPixelRatio(window.devicePixelRatio);
    renderer.shadowMap.enabled = true;

    const controls = new THREE.PointerLockControls(camera, document.body);
    const blocker = document.getElementById('blocker');

    blocker.addEventListener('click', () => { initAudio(); controls.lock(); });
    controls.addEventListener('lock', () => { blocker.style.display = 'none'; });
    controls.addEventListener('unlock', () => { blocker.style.display = 'flex'; });

    let studioPeer = null;
    let connectedDataConns = [];
    const connectedAudiencePeers = new Set();

    function initStudioWebRTC() {
      try {
        studioPeer = new Peer("goody-main-studio");
        studioPeer.on('open', (id) => console.log("Studio Host Live:", id));

        studioPeer.on('call', (call) => {
          call.answer();
          call.on('stream', (remoteStream) => {
            if (call.metadata && call.metadata.contestant === "goody-contestant-2") {
              videoJune.srcObject = remoteStream;
              videoJune.play().catch(e => {});
              showJune = true;
            } else if (call.metadata && call.metadata.contestant === "goody-contestant-1") {
              videoJake.srcObject = remoteStream;
              videoJake.play().catch(e => {});
              showJake = true;
            }
          });
        });

        studioPeer.on('connection', (conn) => {
          connectedDataConns.push(conn);
          conn.on('open', () => {
            connectedAudiencePeers.add(conn.peer);
            broadcastAudienceCount();
            if (studioPower) conn.send({ type: "STUDIO_POWER", power: true });
          });
          conn.on('data', (data) => {
            if (data.type === "PLAYER_ROLLED_DICE") {
              handlePlayerRoll(data.contestant, data.name, data.roll);
            } else if (data.type === "PLAYER_ANSWERED") {
              stageSelectedOption = data.chosenAnswer;
              stageOptionStatus = 'selected';
              renderStageQuestionBoard();
              setTimeout(() => evaluateAnswer(data.contestant, data.chosenAnswer), 1200);
            } else if (data.type === "PLAYER_TIMEOUT") {
              handleQuestionTimeout(data.contestant);
            } else if (data.type === "PLUSHIE_MOVE") {
              handlePlushieMovement(data.contestant, data.direction);
            }
          });
          conn.on('close', () => {
            connectedAudiencePeers.delete(conn.peer);
            connectedDataConns = connectedDataConns.filter(c => c.peer !== conn.peer);
            broadcastAudienceCount();
          });
        });
      } catch(e) {}
    }
    initStudioWebRTC();

    function broadcastAudienceCount() {
      audienceCount = Math.max(1, connectedAudiencePeers.size + 1);
      audienceCountEl.textContent = audienceCount;
      connectedDataConns.forEach(c => { if (c.open) c.send({ type: "AUDIENCE_COUNT", count: audienceCount }); });
    }

    let audioCtx = null;
    let goodyUtterance = null;
    function initAudio() {
      if (!audioCtx) audioCtx = new (window.AudioContext || window.webkitAudioContext)();
      if (audioCtx.state === 'suspended') audioCtx.resume();
    }
    function speakGoody(text, onComplete) {
      if (!('speechSynthesis' in window)) { if (onComplete) onComplete(); return; }
      window.speechSynthesis.cancel();
      goodyUtterance = new SpeechSynthesisUtterance(text);
      goodyUtterance.rate = 0.95; goodyUtterance.pitch = 1.25;
      goodyUtterance.onend = () => { if (onComplete) onComplete(); };
      window.speechSynthesis.speak(goodyUtterance);
    }

    function bootStudio() {
      studioPower = true;
      updateStudioLighting(true);
      updateGoodyFaceExpression();
      updateCameraAlignment();
      speakGoody(INTRO_SPEECH, () => beginTenSecondDiceDuel());
      connectedDataConns.forEach(c => { if (c.open) c.send({ type: "STUDIO_POWER", power: true }); });
    }

    function beginTenSecondDiceDuel() {
      gameState = "OPENING_DUEL"; diceCountdown = 10;
      connectedDataConns.forEach(c => { if (c.open) c.send({ type: "START_DICE_COUNTDOWN" }); });
      diceInterval = setInterval(() => {
        diceCountdown--;
        if (diceCountdown <= 0) { clearInterval(diceInterval); finalizeDiceDuel(); }
      }, 1000);
    }

    function finalizeDiceDuel() {
      p1RollVal = Math.floor(Math.random() * 6) + 1;
      p2RollVal = Math.floor(Math.random() * 6) + 1;
      if (p1RollVal === p2RollVal) p1RollVal++;
      activePlayer = p1RollVal > p2RollVal ? "goody-contestant-1" : "goody-contestant-2";
      gameState = "IN_PLAY";
      nextTurn();
    }

    function nextTurn() {
      activeQuestion = null; renderStageQuestionBoard();
      speakGoody("Next turn ready!", () => {
        connectedDataConns.forEach(c => { if (c.open) c.send({ type: "ENABLE_TURN_ROLL", activeContestant: activePlayer }); });
      });
    }

    // SCENE LIGHTS & GEOMETRIES
    scene.add(new THREE.AmbientLight(0x181026, 0.85));
    const ceilingLight = new THREE.PointLight(0xffecd2, 1.0, 50); ceilingLight.position.set(0, 13.5, 0); scene.add(ceilingLight);
    const deskLampLight = new THREE.PointLight(0xffea9f, 0, 20); deskLampLight.position.set(-6.5, 7.8, -4.5); scene.add(deskLampLight);

    const bedroomFloor = new THREE.Mesh(new THREE.PlaneGeometry(36, 36), new THREE.MeshStandardMaterial({ color: 0x1f140e }));
    bedroomFloor.rotation.x = -Math.PI / 2; scene.add(bedroomFloor);
    const wallMat = new THREE.MeshStandardMaterial({ color: 0x180f26 });
    const backWall = new THREE.Mesh(new THREE.PlaneGeometry(36, 16), wallMat); backWall.position.set(0, 8, -18); scene.add(backWall);

    const deskTop = new THREE.Mesh(new THREE.BoxGeometry(22, 1.0, 16), new THREE.MeshStandardMaterial({ color: 0x331c0e }));
    deskTop.position.set(0, 3.4, -9); scene.add(deskTop);

    const miniDiorama = new THREE.Group(); miniDiorama.position.set(0, 3.95, -9);
    const feltCarpet = new THREE.Mesh(new THREE.CylinderGeometry(7.0, 7.0, 0.08, 48), new THREE.MeshStandardMaterial({ color: 0x271147 }));
    feltCarpet.position.y = 0.44; miniDiorama.add(feltCarpet);

    const miniWall = new THREE.Mesh(new THREE.CylinderGeometry(7.0, 7.0, 4.5, 32, 1, true, -Math.PI / 2, Math.PI), new THREE.MeshStandardMaterial({ color: 0x15092a, side: THREE.BackSide }));
    miniWall.position.y = 2.65; miniDiorama.add(miniWall);

    const COUNTRIES = ["France", "Netherlands", "Canada", "Sweden", "Italy", "Denmark", "Brazil", "Australia", "Spain", "Germany", "UK", "Nigeria", "United States", "Belgium"];
    const boardTileCoords = [];
    for (let i = 0; i < 32; i++) {
      const angle = i * 0.48; const radius = 0.7 + (i * 0.135);
      const x = Math.cos(angle) * radius; const z = 1.8 + (Math.sin(angle) * (radius * 0.88));
      boardTileCoords.push({ x, z, country: COUNTRIES[i % COUNTRIES.length] });
      const tile = new THREE.Mesh(new THREE.CylinderGeometry(0.28, 0.30, 0.08, 24), [
        new THREE.MeshStandardMaterial({ color: 0x241e33 }),
        new THREE.MeshBasicMaterial({ color: i % 2 === 0 ? 0xff7675 : 0x00f0ff }),
        new THREE.MeshBasicMaterial({ color: 0x110d1c })
      ]);
      tile.position.set(x, 0.48, z); miniDiorama.add(tile);
    }

    const qBoardCanvas = document.createElement('canvas'); qBoardCanvas.width = 512; qBoardCanvas.height = 384;
    const qBoardCtx = qBoardCanvas.getContext('2d');
    const qBoardTex = new THREE.CanvasTexture(qBoardCanvas);

    function renderStageQuestionBoard() {
      qBoardCtx.fillStyle = '#120726'; qBoardCtx.fillRect(0, 0, 512, 384);
      qBoardCtx.strokeStyle = '#00f0ff'; qBoardCtx.lineWidth = 6; qBoardCtx.strokeRect(3, 3, 506, 378);
      qBoardCtx.fillStyle = '#ffda66'; qBoardCtx.font = 'bold 26px sans-serif'; qBoardCtx.textAlign = 'center';
      qBoardCtx.fillText("THE GOODY TONIGHT SHOW", 256, 170);
      qBoardTex.needsUpdate = true;
    }
    renderStageQuestionBoard();

    const qBoardMesh = new THREE.Mesh(new THREE.PlaneGeometry(3.6, 2.7), new THREE.MeshBasicMaterial({ map: qBoardTex }));
    qBoardMesh.position.set(-4.8, 3.4, -3.2); qBoardMesh.rotation.y = 0.8; miniDiorama.add(qBoardMesh);

    const studioScreenCanvas = document.createElement('canvas'); studioScreenCanvas.width = 512; studioScreenCanvas.height = 256;
    const sScreenCtx = studioScreenCanvas.getContext('2d');
    const studioScreenTex = new THREE.CanvasTexture(studioScreenCanvas);

    function renderBackstageScreens() {
      sScreenCtx.fillStyle = '#060210'; sScreenCtx.fillRect(0, 0, 512, 256);
      if (studioPower) {
        if (showJake && videoJake.readyState >= 2) sScreenCtx.drawImage(videoJake, 15, 20, 225, 215);
        if (showJune && videoJune.readyState >= 2) sScreenCtx.drawImage(videoJune, 272, 20, 225, 215);
      }
      studioScreenTex.needsUpdate = true;
    }
    const studioBackScreenMesh = new THREE.Mesh(new THREE.PlaneGeometry(6.4, 2.8), new THREE.MeshBasicMaterial({ map: studioScreenTex }));
    studioBackScreenMesh.position.set(0, 3.4, -4.5); miniDiorama.add(studioBackScreenMesh);

    scene.add(miniDiorama);

    let prevTime = performance.now();
    function animate() {
      requestAnimationFrame(animate);
      renderBackstageScreens();
      renderer.render(scene, camera);
    }
    animate();
  </script>
</body>
</html>
