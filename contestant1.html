<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>Goody Tonight Show - Contestant 1</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; user-select: none; -webkit-user-select: none; }
    html, body {
      width: 100%; height: 100%; height: 100dvh;
      overflow: hidden; background: #090314; color: #fff;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
    }
    body { display: flex; flex-direction: column; align-items: center; padding: 6px; }

    #setup-card {
      width: 100%; max-width: 420px; background: #1b0933; border: 2px solid #0984e3;
      border-radius: 16px; padding: 20px; text-align: center; margin-top: 14px;
      box-shadow: 0 0 20px rgba(9, 132, 227, 0.35);
    }
    .badge-podium {
      display: inline-block; padding: 4px 10px; background: #0984e3; color: #fff;
      font-family: monospace; font-weight: 900; font-size: 0.8rem; border-radius: 6px;
      margin-bottom: 10px; letter-spacing: 1px;
    }
    .input-label {
      font-size: 0.72rem; font-family: monospace; color: #ffda66; text-transform: uppercase;
      letter-spacing: 1px; margin-bottom: 3px; display: block; text-align: left;
    }
    .form-group { margin-bottom: 10px; text-align: left; }
    #passcode-input {
      width: 100%; padding: 8px; font-size: 1.6rem; font-family: monospace; font-weight: 900;
      letter-spacing: 8px; text-align: center; background: #080313; color: #39ff14;
      border: 2px solid #a29bfe; border-radius: 10px; outline: none;
    }
    .text-field {
      width: 100%; padding: 10px 12px; font-size: 1rem; font-weight: bold;
      background: #080313; color: #00f0ff; border: 2px solid #a29bfe;
      border-radius: 10px; outline: none;
    }
    .btn-enter {
      width: 100%; padding: 14px; margin-top: 6px; border-radius: 12px; border: none;
      font-size: 1rem; font-weight: 900; text-transform: uppercase; cursor: pointer; color: #fff;
      background: linear-gradient(180deg, #0984e3, #0652dd);
    }

    #live-stage-portal {
      width: 100%; max-width: 440px; height: 100%; display: none;
      flex-direction: column; justify-content: space-between; gap: 4px;
    }
    .badge-bar {
      display: flex; justify-content: space-between; align-items: center;
      background: #18092d; padding: 4px 8px; border-radius: 6px;
      font-family: monospace; font-size: 0.72rem; flex-shrink: 0;
    }
    #mic-status-badge {
      display: none; background: #27ae60; color: #fff; padding: 2px 6px;
      border-radius: 4px; font-weight: 900;
    }

    .screens-container {
      position: relative; width: 100%; aspect-ratio: 16 / 9; max-height: 25vh;
      background: #000; border: 2px solid #ffda66; border-radius: 10px;
      overflow: hidden; touch-action: none; flex-shrink: 0; margin: 0 auto;
    }
    #studio-stream-video { width: 100%; height: 100%; object-fit: cover; pointer-events: none; }
    #local-selfie-pip {
      position: absolute; bottom: 4px; right: 4px; width: 26%; aspect-ratio: 4 / 3;
      border: 2px solid #39ff14; border-radius: 6px; object-fit: cover;
      transform: scaleX(-1); background: #111; z-index: 5; pointer-events: none;
    }

    #turn-banner {
      width: 100%; padding: 5px 8px; border-radius: 6px; text-align: center;
      font-weight: 900; font-size: 0.75rem; font-family: monospace; text-transform: uppercase;
      display: none; flex-shrink: 0;
    }
    .turn-mine { background: #00b894; color: #fff; border: 1.5px solid #55efc4; }
    .turn-theirs { background: #2d1847; color: #dfe6e9; border: 1.5px solid #636e72; }

    #status-pill {
      text-align: center; font-family: monospace; font-size: 0.78rem;
      color: #39ff14; min-height: 18px; line-height: 18px; flex-shrink: 0;
    }

    #choice-card {
      background: #1f0b3b; border: 2px solid #f1c40f; border-radius: 12px;
      padding: 10px; display: none; flex-direction: column; gap: 8px; text-align: center;
    }
    .choice-btn {
      width: 100%; padding: 12px; border-radius: 8px; border: 2px solid;
      font-size: 0.85rem; font-weight: 900; text-transform: uppercase; cursor: pointer; color: #fff;
    }
    .btn-choice-solo { background: #2980b9; border-color: #3498db; }
    .btn-choice-goody { background: #8e44ad; border-color: #9b59b6; }

    #btn-roll-dice {
      width: 100%; padding: 10px; background: #444; border: 2px solid #777;
      border-radius: 10px; font-size: 0.95rem; font-weight: 900; color: #888;
      text-transform: uppercase; cursor: not-allowed; flex-shrink: 0;
    }
    #btn-roll-dice.active-roll {
      background: linear-gradient(180deg, #fdcb6e, #e17055);
      border-color: #ffeaa7; color: #2d3436; cursor: pointer;
    }

    #trivia-card {
      background: #190930; border: 2px solid #00f0ff; border-radius: 10px;
      padding: 8px; display: none; flex-direction: column; gap: 6px; flex-shrink: 1;
    }
    #q-country-tag { font-size: 0.75rem; font-weight: bold; color: #ffda66; text-transform: uppercase; }
    #q-timer { font-family: monospace; font-weight: bold; color: #ff7675; font-size: 0.8rem; text-align: right; }
    #q-text {
      font-size: 0.82rem; font-weight: 600; line-height: 1.3; color: #ffffff;
      background: rgba(0,0,0,0.35); padding: 6px; border-radius: 6px; border-left: 3px solid #00f0ff;
    }
    .options-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 6px; }
    .btn-opt {
      padding: 8px 6px; background: #2f1454; border: 1.5px solid #9c4dd6; border-radius: 8px;
      color: #fff; font-size: 0.75rem; font-weight: bold; text-align: left; cursor: not-allowed;
      opacity: 0.6; white-space: nowrap; overflow: hidden; text-overflow: ellipsis;
    }
    .btn-opt.unlocked { cursor: pointer; opacity: 1; border-color: #00f0ff; }
    .btn-opt.selected { background: #6c5ce7; border-color: #fdcb6e; }
    .btn-opt.flash-green { background: #00b894 !important; }
    .btn-opt.flash-red { background: #d63031 !important; }

    #recap-card {
      background: #1c0a32; border: 2px solid #fdcb6e; border-radius: 10px;
      padding: 8px 10px; display: none; flex-direction: column; gap: 4px; flex-shrink: 1;
    }
    .dpad-section {
      background: #140728; border: 1.5px solid #a29bfe; border-radius: 10px;
      padding: 4px; display: flex; flex-direction: column; align-items: center; gap: 2px;
    }
    .dpad-grid { display: grid; grid-template-columns: 46px 46px 46px; grid-template-rows: 32px 32px; gap: 4px; }
    .dpad-btn {
      background: #2b1154; border: 2px solid #ff79b0; border-radius: 6px; color: #fff;
      font-size: 1rem; font-weight: bold; display: flex; justify-content: center; align-items: center; cursor: pointer;
    }
  </style>
</head>
<body>
  <div id="setup-card">
    <div class="badge-podium">PODIUM 1</div>
    <h2 style="color: #ffda66; margin-bottom: 12px; font-size: 1.25rem;">The Goody Tonight Show</h2>
    <div class="form-group">
      <span class="input-label">Host Screen 4-Digit Code:</span>
      <input type="text" id="passcode-input" maxlength="4" placeholder="0000" inputmode="numeric" pattern="[0-9]*" autocomplete="off" />
    </div>
    <div class="form-group">
      <span class="input-label">First Name:</span>
      <input type="text" id="name-input" class="text-field" maxlength="15" placeholder="e.g. Jake" autocomplete="given-name" />
    </div>
    <div class="form-group">
      <span class="input-label">Hometown / City:</span>
      <input type="text" id="city-input" class="text-field" maxlength="20" placeholder="e.g. London" autocomplete="address-level2" />
    </div>
    <button class="btn-enter" id="btn-enter-studio">Enter Live Studio</button>
  </div>

  <main id="live-stage-portal">
    <div class="badge-bar">
      <span id="role-tag" style="color: #00f0ff;">CONNECTING...</span>
      <span id="mic-status-badge">🎙️ MIC LIVE</span>
      <span id="match-timer-badge" style="color: #ffda66;">SHOW: 20:00</span>
    </div>

    <div class="screens-container" id="interactive-viewport">
      <video id="studio-stream-video" autoplay playsinline></video>
      <video id="local-selfie-pip" autoplay playsinline muted></video>
    </div>

    <div id="turn-banner"></div>
    <div id="status-pill">Waiting for host...</div>

    <div id="choice-card">
      <div style="color:#ffda66; font-size:0.85rem; font-weight:900; text-transform:uppercase;">Make Your Choice, Contestant!</div>
      <button class="choice-btn btn-choice-solo" id="btn-pick-solo">Race Solo Against Clock</button>
      <button class="choice-btn btn-choice-goody" id="btn-pick-goody">Battle Goody Head-To-Head</button>
    </div>

    <button id="btn-roll-dice" disabled>ROLL DICE (LOCKED)</button>

    <div id="trivia-card">
      <div style="display:flex; justify-content:space-between; align-items:center;">
        <span id="q-country-tag">COUNTRY</span>
        <span id="q-timer">30s</span>
      </div>
      <div id="q-text">Loading question...</div>
      <div class="options-grid">
        <button class="btn-opt" id="opt-0" disabled>A) ...</button>
        <button class="btn-opt" id="opt-1" disabled>B) ...</button>
        <button class="btn-opt" id="opt-2" disabled>C) ...</button>
        <button class="btn-opt" id="opt-3" disabled>D) ...</button>
      </div>
    </div>

    <div id="recap-card">
      <div id="recap-header" style="font-size:0.76rem; font-weight:bold; color:#fdcb6e;">RECAP: WHAT WE LEARNED</div>
      <div id="recap-body" style="font-size:0.82rem; line-height:1.3; color:#fff;">Recap loading...</div>
    </div>

    <div class="dpad-section">
      <div class="dpad-grid">
        <div></div><button class="dpad-btn" id="dpad-fwd">▲</button><div></div>
        <button class="dpad-btn" id="dpad-left">◀</button><button class="dpad-btn" id="dpad-back">▼</button><button class="dpad-btn" id="dpad-right">▶</button>
      </div>
    </div>
  </main>

  <script src="https://unpkg.com/peerjs@1.5.4/dist/peerjs.min.js"></script>
  <script>
    let playerSessionToken = sessionStorage.getItem("goody_session_token_c1") || "s1_" + Math.random().toString(36).substring(2, 9);
    sessionStorage.setItem("goody_session_token_c1", playerSessionToken);

    const CONTESTANT_ID = "goody-contestant-1";
    let localStream = null, peer = null, dataConn = null, mediaCall = null;
    let contestantName = "", contestantCity = "", hasRolled = false;
    let rollTimer = null, questionTimer = null, currentQuestionData = null, selectedOptionIndex = null;

    const passcodeInput = document.getElementById('passcode-input');
    const nameInput = document.getElementById('name-input');
    const cityInput = document.getElementById('city-input');
    const btnEnterStudio = document.getElementById('btn-enter-studio');
    const setupCard = document.getElementById('setup-card');
    const liveStagePortal = document.getElementById('live-stage-portal');
    const localSelfiePip = document.getElementById('local-selfie-pip');
    const studioStreamVideo = document.getElementById('studio-stream-video');
    const roleTag = document.getElementById('role-tag');
    const micStatusBadge = document.getElementById('mic-status-badge');
    const matchTimerBadge = document.getElementById('match-timer-badge');
    const turnBanner = document.getElementById('turn-banner');
    const statusPill = document.getElementById('status-pill');
    const btnRollDice = document.getElementById('btn-roll-dice');
    const choiceCard = document.getElementById('choice-card');
    const triviaCard = document.getElementById('trivia-card');
    const qCountryTag = document.getElementById('q-country-tag');
    const qText = document.getElementById('q-text');
    const qTimer = document.getElementById('q-timer');
    const optButtons = [
      document.getElementById('opt-0'), document.getElementById('opt-1'),
      document.getElementById('opt-2'), document.getElementById('opt-3')
    ];
    const recapCard = document.getElementById('recap-card');
    const recapHeader = document.getElementById('recap-header');
    const recapBody = document.getElementById('recap-body');

    function setLocalMicEnabled(enabled) {
      if (localStream) {
        const audioTracks = localStream.getAudioTracks();
        if (audioTracks.length > 0) audioTracks[0].enabled = enabled;
      }
      micStatusBadge.style.display = enabled ? 'inline-block' : 'none';
    }

    btnEnterStudio.addEventListener('click', () => {
      const code = passcodeInput.value.trim();
      const name = nameInput.value.trim();
      const city = cityInput.value.trim() || "London";
      if (!/^\d{4}$/.test(code) || name.length < 2) return alert("Enter valid credentials.");
      joinGame(name, city, code);
    });

    async function joinGame(name, city, enteredCode) {
      contestantName = name; contestantCity = city;
      setupCard.style.display = 'none'; liveStagePortal.style.display = 'flex';
      roleTag.textContent = `${name.toUpperCase()} (CONTESTANT 1)`;

      try {
        localStream = await navigator.mediaDevices.getUserMedia({ video: true, audio: true });
        localSelfiePip.srcObject = localStream;
        setLocalMicEnabled(false);

        peer = new Peer();
        peer.on('open', () => {
          mediaCall = peer.call("goody-main-studio", localStream, {
            metadata: { contestant: CONTESTANT_ID, name, city, passcode: enteredCode, sessionToken: playerSessionToken }
          });
          mediaCall.on('stream', stream => {
            studioStreamVideo.srcObject = stream;
            studioStreamVideo.play().catch(() => {});
          });

          dataConn = peer.connect("goody-main-studio", {
            metadata: { contestant: CONTESTANT_ID, name, city, passcode: enteredCode, sessionToken: playerSessionToken }
          });

          dataConn.on('data', data => {
            if (data.type === "SYNC_MATCH_TIMER") {
              matchTimerBadge.textContent = `SHOW: ${data.timeStr}`;
            } else if (data.type === "ENABLE_TURN_ROLL") {
              setLocalMicEnabled(false);
              const isMe = data.activeContestantId === CONTESTANT_ID;
              turnBanner.style.display = 'block';
              turnBanner.className = isMe ? 'turn-mine' : 'turn-theirs';
              turnBanner.textContent = isMe ? "YOUR TURN TO ROLL!" : `WAITING FOR ${data.activeContestantName.toUpperCase()} TO ROLL...`;
              if (isMe) startTenSecondRoll();
              else {
                btnRollDice.disabled = true;
                btnRollDice.classList.remove('active-roll');
                btnRollDice.textContent = "WAITING...";
              }
            } else if (data.type === "SHOW_QUESTION_LOCKED") {
              setLocalMicEnabled(false);
              showQuestionLocked(data.question, data.activeContestantId === CONTESTANT_ID, data.activeContestantName);
            } else if (data.type === "UNLOCK_QUESTION_INPUT") {
              if (data.activeContestantId === CONTESTANT_ID) unlockQuestionInput();
            } else if (data.type === "EVALUATION_RESULT") {
              handleEvaluationResult(data);
            } else if (data.type === "OFFER_CONTESTANT_CHOICE") {
              choiceCard.style.display = 'flex';
            }
          });
        });
      } catch (e) {
        alert("Camera and Mic required.");
        window.location.reload();
      }
    }

    function startTenSecondRoll() {
      hasRolled = false;
      btnRollDice.disabled = false;
      btnRollDice.classList.add('active-roll');
      btnRollDice.textContent = "ROLL DICE NOW!";
      let timeLeft = 10;
      statusPill.textContent = `ROLL TIMER: ${timeLeft}s`;

      if (rollTimer) clearInterval(rollTimer);
      rollTimer = setInterval(() => {
        timeLeft--;
        if (timeLeft > 0) statusPill.textContent = `ROLL TIMER: ${timeLeft}s`;
        else {
          clearInterval(rollTimer);
          btnRollDice.disabled = true;
          btnRollDice.classList.remove('active-roll');
          btnRollDice.textContent = "TIME EXPIRED";
          statusPill.textContent = "Host is rolling for you...";
        }
      }, 1000);
    }

    btnRollDice.addEventListener('click', () => {
      if (hasRolled) return;
      hasRolled = true;
      if (rollTimer) clearInterval(rollTimer);
      btnRollDice.disabled = true;
      btnRollDice.classList.remove('active-roll');
      btnRollDice.textContent = "DICE ROLLED!";
      const roll = Math.floor(Math.random() * 6) + 1;
      dataConn.send({ type: "PLAYER_ROLLED_DICE", contestant: CONTESTANT_ID, name: contestantName, roll });
    });

    function showQuestionLocked(qData, isMe, activeName) {
      currentQuestionData = qData;
      selectedOptionIndex = null;
      triviaCard.style.display = 'flex';
      recapCard.style.display = 'none';
      btnRollDice.style.display = 'none';
      qCountryTag.textContent = `${qData.country} (${isMe ? "YOUR QUESTION" : activeName.toUpperCase() + "'S QUESTION"})`;
      qText.textContent = qData.text || qData.q;
      qTimer.textContent = "LISTENING...";
      qData.options.forEach((opt, idx) => {
        optButtons[idx].textContent = `${["A","B","C","D"][idx]}) ${opt}`;
        optButtons[idx].className = "btn-opt";
        optButtons[idx].disabled = true;
      });
    }

    function unlockQuestionInput() {
      setLocalMicEnabled(true);
      optButtons.forEach(b => { b.disabled = false; b.classList.add('unlocked'); });
      let timeLeft = 30;
      qTimer.textContent = `${timeLeft}s`;
      if (questionTimer) clearInterval(questionTimer);
      questionTimer = setInterval(() => {
        timeLeft--;
        if (timeLeft > 0) qTimer.textContent = `${timeLeft}s`;
        else {
          clearInterval(questionTimer);
          setLocalMicEnabled(false);
          optButtons.forEach(b => b.disabled = true);
          dataConn.send({ type: "PLAYER_TIMEOUT", contestant: CONTESTANT_ID });
        }
      }, 1000);
    }

    optButtons.forEach((btn, idx) => {
      btn.addEventListener('click', () => {
        if (selectedOptionIndex !== null) return;
        selectedOptionIndex = idx;
        if (questionTimer) clearInterval(questionTimer);
        setLocalMicEnabled(false);
        optButtons.forEach(b => { b.disabled = true; b.classList.remove('unlocked'); });
        btn.classList.add('selected');
        dataConn.send({ type: "PLAYER_ANSWERED", contestant: CONTESTANT_ID, chosenAnswer: currentQuestionData.options[idx] });
      });
    });

    function handleEvaluationResult(data) {
      if (questionTimer) clearInterval(questionTimer);
      setLocalMicEnabled(false);
      const targetIdx = currentQuestionData ? currentQuestionData.options.indexOf(data.chosenAnswer) : -1;
      if (targetIdx !== -1 && optButtons[targetIdx]) {
        optButtons[targetIdx].classList.add(data.isCorrect ? 'flash-green' : 'flash-red');
      }
      setTimeout(() => {
        triviaCard.style.display = 'none';
        recapHeader.textContent = `WHAT WE LEARNED (${data.country}):`;
        recapBody.textContent = data.recap;
        recapCard.style.display = 'flex';
      }, 1200);
    }

    document.getElementById('btn-pick-solo').addEventListener('click', () => {
      choiceCard.style.display = 'none';
      dataConn.send({ type: "CONTESTANT_CHOSE_PATH", choice: "SOLO", contestant: CONTESTANT_ID });
    });
    document.getElementById('btn-pick-goody').addEventListener('click', () => {
      choiceCard.style.display = 'none';
      dataConn.send({ type: "CONTESTANT_CHOSE_PATH", choice: "GOODY", contestant: CONTESTANT_ID });
    });
  </script>
</body>
</html>
