<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>The Goody Tonight Show - Main Studio</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body { background: #07020d; color: #fff; font-family: sans-serif; overflow: hidden; height: 100vh; }

    #studio-layout {
      display: grid;
      grid-template-columns: 240px 1fr 240px;
      grid-template-rows: 60px 1fr 140px;
      height: 100vh;
      gap: 8px;
      padding: 8px;
    }

    /* Top Broadcast Bar */
    header {
      grid-column: 1 / -1; background: #130624; border: 2px solid #6c5ce7; border-radius: 8px;
      display: flex; justify-content: space-between; align-items: center; padding: 0 16px;
    }
    .title { font-size: 1.1rem; color: #ffda66; font-weight: 900; letter-spacing: 1px; }
    .timer-badge { font-family: monospace; font-size: 1.2rem; color: #39ff14; }

    /* Left & Right Contestant Screens */
    .contestant-screen-box {
      background: #000; border-radius: 10px; overflow: hidden; position: relative;
      display: flex; flex-direction: column; justify-content: center; align-items: center;
    }
    #screen-jake { border: 3px solid #0984e3; }
    #screen-june { border: 3px solid #d63031; }
    video.feed { width: 100%; height: 100%; object-fit: cover; }
    .nametag {
      position: absolute; bottom: 8px; left: 8px; background: rgba(0,0,0,0.7);
      padding: 4px 10px; border-radius: 4px; font-weight: bold; font-size: 0.8rem;
    }

    /* Center Stage (3D Canvas / Game Board) */
    #center-stage {
      background: #14072b; border: 2px solid #ff79b0; border-radius: 10px;
      position: relative; display: flex; flex-direction: column; align-items: center;
      justify-content: center; overflow: hidden;
    }
    #center-status { font-size: 1.2rem; color: #00f0ff; font-weight: bold; text-align: center; }

    /* Bottom Control & Host Monitor */
    footer {
      grid-column: 1 / -1; background: #130624; border: 2px solid #5d2e8c; border-radius: 8px;
      display: flex; justify-content: space-around; align-items: center; padding: 8px;
    }
    .score-box { font-family: monospace; font-size: 1.1rem; font-weight: 900; }
  </style>
</head>
<body>

  <div id="studio-layout">
    <header>
      <div class="title">🧸 THE GOODY TONIGHT SHOW</div>
      <div id="clock" class="timer-badge">⏱️ 10:00</div>
      <div style="color: #ff7675; font-weight: bold;">🔴 BROADCAST FEED</div>
    </header>

    <!-- Contestant 1 (Jake) -->
    <div class="contestant-screen-box" id="screen-jake">
      <video id="v-feed-jake" class="feed" autoplay playsinline></video>
      <div class="nametag" style="color: #00f0ff;">P1: JAKE (LONDON)</div>
    </div>

    <!-- Center Stage Arena -->
    <div id="center-stage">
      <div id="center-status">WAITING FOR CONTESTANTS...</div>
    </div>

    <!-- Contestant 2 (June) -->
    <div class="contestant-screen-box" id="screen-june">
      <video id="v-feed-june" class="feed" autoplay playsinline></video>
      <div class="nametag" style="color: #ff7675;">P2: JUNE (NOTTINGHAM)</div>
    </div>

    <footer>
      <div class="score-box" style="color: #00f0ff;">JAKE TILE: <span id="tile-p1">START</span></div>
      <div style="font-size: 0.9rem; color: #fdcb6e;">GOODBY STANDBY: READY</div>
      <div class="score-box" style="color: #ff7675;">JUNE TILE: <span id="tile-p2">START</span></div>
    </footer>
  </div>

  <script src="https://unpkg.com/peerjs@1.5.4/dist/peerjs.min.js"></script>
  <script>
    const studioPeerId = "goody-main-studio";
    const peer = new Peer(studioPeerId);

    let streamJake = null;
    let streamJune = null;
    let connJake = null;
    let connJune = null;
    let connAdmin = null;

    let activePlayer = "Jake";

    peer.on('open', (id) => {
      console.log("Main Studio Peer opened:", id);
    });

    // Handle Incoming Video Calls from Jake / June
    peer.on('call', (call) => {
      // Return a dummy canvas stream or host stream back to contestant
      const fakeCanvas = document.createElement('canvas');
      fakeCanvas.width = 320; fakeCanvas.height = 180;
      const ctx = fakeCanvas.getContext('2d');
      ctx.fillStyle = "#14072b"; ctx.fillRect(0,0,320,180);
      const dummyStream = fakeCanvas.captureStream(10);

      call.answer(dummyStream);

      call.on('stream', (remoteStream) => {
        if (call.metadata && call.metadata.contestant === "goody-contestant-1") {
          document.getElementById('v-feed-jake').srcObject = remoteStream;
          streamJake = remoteStream;
        } else if (call.metadata && call.metadata.contestant === "goody-contestant-2") {
          document.getElementById('v-feed-june').srcObject = remoteStream;
          streamJune = remoteStream;
        }
      });
    });

    // Handle Data Connections from Admin and Contestants
    peer.on('connection', (conn) => {
      conn.on('data', (data) => {
        if (conn.peer === 'goody-admin-panel') {
          connAdmin = conn;
          handleAdminCommand(data);
        } else if (data.contestant === 'goody-contestant-1') {
          connJake = conn;
          handleContestantAction(data);
        } else if (data.contestant === 'goody-contestant-2') {
          connJune = conn;
          handleContestantAction(data);
        }
      });
    });

    function handleAdminCommand(data) {
      if (data.type === 'FORCE_TURN') {
        activePlayer = data.name;
        document.getElementById('center-status').textContent = `${data.name.toUpperCase()}'S TURN TO ROLL!`;
        broadcastToPlayers({
          type: 'ENABLE_TURN_ROLL',
          activeContestantId: data.contestantId,
          activeContestantName: data.name
        });
      }
    }

    function handleContestantAction(data) {
      if (data.type === 'PLAYER_ROLLED_DICE') {
        document.getElementById('center-status').textContent = `${data.name} rolled a ${data.roll}!`;
      }
    }

    function broadcastToPlayers(msg) {
      if (connJake && connJake.open) connJake.send(msg);
      if (connJune && connJune.open) connJune.send(msg);
    }
  </script>
</body>
</html>
